site_name: 設計書
site_description: 人が読む設計書のテンプレートです。業務、機能、サービスメソッドまでを書きます。
# MkDocs は、設定ファイルのあるフォルダ自体を原稿にできない。
# mkdocs/docs は、リポジトリ直下の原稿へのリンク。
docs_dir: mkdocs/docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: ja
  font: false
  features:
    - navigation.expand
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードへ
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードへ

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang:
        - ja
        - en

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - はじめに: README.md
  - 用語集: 用語集.md
  - 業務フロー:
      - プロフィールを公開する: docs/business/index.md
      - ログインして商品を探す: docs/business/ログインして商品を探す.md
  - API:
      - 新しいAPIの型:
          - 入口: apis/_template/README.md
          - 用語: apis/_template/用語.md
          - 処理詳細: apis/_template/処理詳細.md
          - 変更履歴: apis/_template/変更履歴.md
      - 記入例 プロフィールを公開する:
          - 入口: apis/publish-profile/README.md
          - 用語: apis/publish-profile/用語.md
          - 処理詳細: apis/publish-profile/処理詳細.md
          - 変更履歴: apis/publish-profile/変更履歴.md
      - 記入例 ログインする:
          - 入口: apis/login/README.md
          - 用語: apis/login/用語.md
          - 処理詳細: apis/login/処理詳細.md
          - 変更履歴: apis/login/変更履歴.md
      - 記入例 ログアウトする:
          - 入口: apis/logout/README.md
          - 用語: apis/logout/用語.md
          - 処理詳細: apis/logout/処理詳細.md
          - 変更履歴: apis/logout/変更履歴.md
      - 記入例 商品詳細を取得する:
          - 入口: apis/get-product/README.md
          - 用語: apis/get-product/用語.md
          - 処理詳細: apis/get-product/処理詳細.md
          - 変更履歴: apis/get-product/変更履歴.md
      - 記入例 商品一覧を取得する:
          - 入口: apis/list-products/README.md
          - 用語: apis/list-products/用語.md
          - 処理詳細: apis/list-products/処理詳細.md
          - 変更履歴: apis/list-products/変更履歴.md
      - 記入例 商品を検索する:
          - 入口: apis/search-products/README.md
          - 用語: apis/search-products/用語.md
          - 処理詳細: apis/search-products/処理詳細.md
          - 変更履歴: apis/search-products/変更履歴.md
  - 決定記録:
      - テンプレートの方針: decisions/0000-template.md
