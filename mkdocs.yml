site_name: 設計書
site_description: 人が読む設計書のテンプレートです。業務、機能、サービスメソッドまでを書きます。
# 公開する URL。pages.yml が環境変数 SITE_URL で渡す（mkdocs build に --site-url は無い）。
# 無いとき（手元や PR の確認）は空のままにする。
site_url: !ENV SITE_URL
# MkDocs は、設定ファイルのあるフォルダ自体を原稿にできない。
# mkdocs/docs は、リポジトリ直下の原稿へのリンク。
docs_dir: mkdocs/docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: ja
  font: false
  features:
    - navigation.expand
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードへ
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードへ

# 同じ見出しのアンカーを GitHub と同じ「-1」にする
hooks:
  - scripts/mkdocs_hooks.py

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/image-zoom.js
  - javascripts/test-table-wrap.js

plugins:
  - search:
      lang:
        - ja
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # 目次のアンカーを GitHub と同じにする（日本語を残し、小文字にして、記号を消す）
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences

nav:
  - はじめに: README.md
  - GitHub の設定: docs/setup.md
  - 書き方と自動化（AI向け）: docs/guide.md
  - 用語集: 用語集.md
  - 業務フロー:
      - 一覧: docs/business/index.md
      - プロフィールを公開する:
          - 概要: docs/business/プロフィールを公開する/README.md
          - 変更履歴: docs/business/プロフィールを公開する/変更履歴.md
      - ログインして商品を探す:
          - 概要: docs/business/ログインして商品を探す/README.md
          - 変更履歴: docs/business/ログインして商品を探す/変更履歴.md
      - カードで支払う:
          - 概要: docs/business/カードで支払う/README.md
          - 変更履歴: docs/business/カードで支払う/変更履歴.md
      - パスキーの端末をなくす:
          - 概要: docs/business/パスキーの端末をなくす/README.md
          - 変更履歴: docs/business/パスキーの端末をなくす/変更履歴.md
  - インフラ構成: docs/infra/index.md
  - API:
      - 一覧: apis/index.md
      - 新しいAPIの型:
          - 入口: apis/_template/README.md
          - 設計書: apis/_template/処理詳細.md
          - 変更履歴: apis/_template/変更履歴.md
      - 記入例 プロフィール公開API:
          - 入口: apis/publish-profile/README.md
          - 設計書: apis/publish-profile/処理詳細.md
          - 変更履歴: apis/publish-profile/変更履歴.md
      - 記入例 ログインAPI:
          - 入口: apis/login/README.md
          - 設計書: apis/login/処理詳細.md
          - 変更履歴: apis/login/変更履歴.md
      - 記入例 ログアウトAPI:
          - 入口: apis/logout/README.md
          - 設計書: apis/logout/処理詳細.md
          - 変更履歴: apis/logout/変更履歴.md
      - 記入例 商品詳細取得API:
          - 入口: apis/get-product/README.md
          - 設計書: apis/get-product/処理詳細.md
          - 変更履歴: apis/get-product/変更履歴.md
      - 記入例 商品一覧取得API:
          - 入口: apis/list-products/README.md
          - 設計書: apis/list-products/処理詳細.md
          - 変更履歴: apis/list-products/変更履歴.md
      - 記入例 商品検索API:
