site_name: 設計書
site_description: 人が読む設計書のテンプレートです。業務、機能、サービスメソッドまでを書きます。
# MkDocs は、設定ファイルのあるフォルダ自体を原稿にできない。
# mkdocs/docs は、リポジトリ直下の原稿へのリンク。
docs_dir: mkdocs/docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: ja
  font: false
  features:
    - navigation.expand
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードへ
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードへ

# 同じ見出しのアンカーを GitHub と同じ「-1」にする
hooks:
  - scripts/mkdocs_hooks.py

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang:
        - ja
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # 目次のアンカーを GitHub と同じにする（日本語を残し、小文字にして、記号を消す）
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences

nav:
  - はじめに: README.md
  - GitHub の設定: docs/setup.md
  - 書き方と自動化（AI向け）: docs/guide.md
  - 用語集: 用語集.md
  - 図の書き方の例: docs/examples/index.md
  - 業務フロー:
      - プロフィールを公開する:
          - 概要: docs/business/プロフィールを公開する/README.md
          - 変更履歴: docs/business/プロフィールを公開する/変更履歴.md
      - ログインして商品を探す:
          - 概要: docs/business/ログインして商品を探す/README.md
          - 変更履歴: docs/business/ログインして商品を探す/変更履歴.md
      - カードで支払う:
          - 概要: docs/business/カードで支払う/README.md
          - 変更履歴: docs/business/カードで支払う/変更履歴.md
      - パスキーの端末をなくす:
          - 概要: docs/business/パスキーの端末をなくす/README.md
          - 変更履歴: docs/business/パスキーの端末をなくす/変更履歴.md
  - インフラ構成: docs/infra/index.md
  - API:
      - 新しいAPIの型:
          - 入口: apis/_template/README.md
          - 設計書: apis/_template/処理詳細.md
          - 変更履歴: apis/_template/変更履歴.md
      - 記入例 プロフィールを公開する:
          - 入口: apis/publish-profile/README.md
          - 設計書: apis/publish-profile/処理詳細.md
          - 変更履歴: apis/publish-profile/変更履歴.md
      - 記入例 ログインする:
          - 入口: apis/login/README.md
          - 設計書: apis/login/処理詳細.md
          - 変更履歴: apis/login/変更履歴.md
      - 記入例 ログアウトする:
          - 入口: apis/logout/README.md
          - 設計書: apis/logout/処理詳細.md
          - 変更履歴: apis/logout/変更履歴.md
      - 記入例 商品詳細を取得する:
          - 入口: apis/get-product/README.md
          - 用語: apis/get-product/用語.md
          - 処理詳細: apis/get-product/処理詳細.md
          - 変更履歴: apis/get-product/変更履歴.md
      - 記入例 商品一覧を取得する:
          - 入口: apis/list-products/README.md
          - 用語: apis/list-products/用語.md
          - 処理詳細: apis/list-products/処理詳細.md
          - 変更履歴: apis/list-products/変更履歴.md
      - 記入例 商品を検索する:
          - 入口: apis/search-products/README.md
          - 用語: apis/search-products/用語.md
          - 処理詳細: apis/search-products/処理詳細.md
          - 変更履歴: apis/search-products/変更履歴.md
      - 記入例 パスキーを登録する:
          - 入口: apis/register-passkey/README.md
          - 設計書: apis/register-passkey/処理詳細.md
          - 変更履歴: apis/register-passkey/変更履歴.md
      - 記入例 パスキーでログインする:
          - 入口: apis/login-passkey/README.md
          - 設計書: apis/login-passkey/処理詳細.md
          - 変更履歴: apis/login-passkey/変更履歴.md
      - 記入例 アカウントを復旧する:
          - 入口: apis/recover-account/README.md
          - 用語: apis/recover-account/用語.md
          - 処理詳細: apis/recover-account/処理詳細.md
          - 変更履歴: apis/recover-account/変更履歴.md
      - 記入例 カードを登録する:
          - 入口: apis/register-card/README.md
          - 用語: apis/register-card/用語.md
          - 処理詳細: apis/register-card/処理詳細.md
          - 変更履歴: apis/register-card/変更履歴.md
      - 記入例 支払う:
          - 入口: apis/create-payment/README.md
          - 用語: apis/create-payment/用語.md
          - 処理詳細: apis/create-payment/処理詳細.md
          - 変更履歴: apis/create-payment/変更履歴.md
      - 記入例 注文の状態を見る:
          - 入口: apis/get-order/README.md
          - 用語: apis/get-order/用語.md
          - 処理詳細: apis/get-order/処理詳細.md
          - 変更履歴: apis/get-order/変更履歴.md
      - 記入例 決済の結果を受け取る:
          - 入口: apis/payment-webhook/README.md
          - 用語: apis/payment-webhook/用語.md
          - 処理詳細: apis/payment-webhook/処理詳細.md
          - 変更履歴: apis/payment-webhook/変更履歴.md
  - 決定記録:
      - テンプレートの方針: decisions/0000-template.md
