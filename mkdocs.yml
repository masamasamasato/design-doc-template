          - 設計書: apis/search-products/処理詳細.md
          - 変更履歴: apis/search-products/変更履歴.md
      - 記入例 パスキー登録API:
          - 入口: apis/register-passkey/README.md
          - 設計書: apis/register-passkey/処理詳細.md
          - 変更履歴: apis/register-passkey/変更履歴.md
      - 記入例 パスキーログインAPI:
          - 入口: apis/login-passkey/README.md
          - 設計書: apis/login-passkey/処理詳細.md
          - 変更履歴: apis/login-passkey/変更履歴.md
      - 記入例 アカウント復旧API:
          - 入口: apis/recover-account/README.md
          - 設計書: apis/recover-account/処理詳細.md
          - 変更履歴: apis/recover-account/変更履歴.md
      - 記入例 カード登録API:
          - 入口: apis/register-card/README.md
          - 設計書: apis/register-card/処理詳細.md
          - 変更履歴: apis/register-card/変更履歴.md
      - 記入例 支払いAPI:
          - 入口: apis/create-payment/README.md
          - 設計書: apis/create-payment/処理詳細.md
          - 変更履歴: apis/create-payment/変更履歴.md
      - 記入例 注文状態取得API:
          - 入口: apis/get-order/README.md
          - 設計書: apis/get-order/処理詳細.md
