name: 変更履歴を追記する

# main への push だけで動く。PR から書き換えたこのファイルは、マージされるまで動かない。
# そのため、main を書き換えられるデプロイキーは、マージ済みの内容でだけ使われる。
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    env:
      # 追記コミットの作者とコミッター。「マージしたPRを探す」は、この値で自分の追記の push を見分ける
      CHANGELOG_NAME: github-actions[bot]
      CHANGELOG_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    permissions:
      contents: read
      pull-requests: read
      pages: read
    steps:
      - name: マージしたPRを探す
        # PR が無い push は2通りある。このジョブ自身の追記の push と、それ以外（直接の push など）。
        # 追記の push は、作者とコミッターがジョブの CHANGELOG_NAME と CHANGELOG_EMAIL で、変えたファイルが
        # 変更履歴.md だけ、親が1つのコミットで見分ける。探し直さずに、成功で止まる。
        # コミットのメッセージでは判定しない（squash では PR 本文も入るため）
        # マージの直後は、GitHub がコミットと PR をまだ結び付けておらず、空が返ることがある（#63 の fc8bff4）。
        # 空のときは 5 秒おきに最大 6 回探し直す（最初の1回と合わせて7回、待つのは最長30秒）。
        # それでも空なら、変更履歴をとばしたことに気づけるよう、失敗にする
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}")"
          author="$(jq -r '.commit.author.name + " <" + .commit.author.email + ">"' <<<"$commit")"
          committer="$(jq -r '.commit.committer.name + " <" + .commit.committer.email + ">"' <<<"$commit")"
          parents="$(jq '.parents | length' <<<"$commit")"
          others="$(jq -r '.files[].filename' <<<"$commit" | grep -Ev '^(apis|docs/business|tests)/[^_/][^/]*/変更履歴\.md$' || true)"
          files="$(jq '.files | length' <<<"$commit")"
          bot="${CHANGELOG_NAME} <${CHANGELOG_EMAIL}>"
          if [ "$author" = "$bot" ] && [ "$committer" = "$bot" ] && [ "$parents" = 1 ] && [ "$files" -gt 0 ] && [ -z "$others" ]; then
            echo "変更履歴を追記したコミットなので、追記しません"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          json=""
          for try in 0 1 2 3 4 5 6; do
            if [ "$try" -gt 0 ]; then
              echo "マージしたPRが見つからないので、5秒後に探し直します（${try}/6回目）"
              sleep 5
            fi
            json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0] // empty')"
            if [ -n "$json" ]; then
              break
            fi
          done
          if [ -z "$json" ]; then
            echo "::error::${SHA} のマージしたPRが、7回（30秒）探しても見つかりません。変更履歴は追記していません。PR を通さない push なら、変更履歴を手で直してください。PR からのマージなら、このジョブを再実行してください"
            exit 1
          fi
          {
            echo "found=true"
            echo "number=$(jq -r .number <<<"$json")"
            echo "base=$(jq -r .base.sha <<<"$json")"
            echo "head=$(jq -r .head.sha <<<"$json")"
            echo "title<<__TITLE__"
            jq -r .title <<<"$json"
            echo "__TITLE__"
          } >> "$GITHUB_OUTPUT"

      - name: mainを取得する
        if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # main はルールで直接 push を禁止している。例外はこのデプロイキーだけ
          ssh-key: ${{ secrets.CHANGELOG_DEPLOY_KEY }}
          # 後の git push でこの鍵を使うので、認証情報を残す（既定と同じ true）
          persist-credentials: true

      - name: 変更したドキュメントを Job Summary に出す
        if: steps.pr.outputs.found == 'true'
        # 表示だけなので、失敗しても変更履歴の追記は続ける
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          GH_TOKEN: ${{ github.token }}
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${BASE_SHA}" "${HEAD_SHA}"
          SITE_URL="$(./scripts/docs-site-url.sh)" python3 scripts/list-changed-docs.py "${BASE_SHA}" "${HEAD_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: 変更履歴へ1行足す
        if: steps.pr.outputs.found == 'true'
        env:
          BASE_SHA: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 三点リーダーのマージベースを取れるよう、PR の先端も取得する。
          git fetch --no-tags origin "${BASE_SHA}" "${HEAD_SHA}"
          python3 scripts/append-changelog.py
          if git diff --quiet; then
            echo "追記はありません"
            exit 0
          fi
          git config user.name "${CHANGELOG_NAME}"
          git config user.email "${CHANGELOG_EMAIL}"
          git add -- ':(glob)apis/*/変更履歴.md' ':(exclude,glob)apis/_*/変更履歴.md' ':(glob)docs/business/*/変更履歴.md' ':(exclude,glob)docs/business/_*/変更履歴.md' ':(glob)tests/*/変更履歴.md' ':(exclude,glob)tests/_*/変更履歴.md'
          git commit -m "変更履歴を更新 [changelog]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            # デプロイキーの push は pages.yml を起動するので、ここで呼ばない
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "push に失敗しました" >&2
          exit 1
