name: 変更履歴を追記する

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  append:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - name: mainを取得する
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # main はルールで直接 push を禁止している。例外はこのデプロイキーだけ
          ssh-key: ${{ secrets.CHANGELOG_DEPLOY_KEY }}

      - name: 変更したドキュメントを Job Summary に出す
        # 表示だけなので、失敗しても変更履歴の追記は続ける
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${BASE_SHA}" "${HEAD_SHA}"
          SITE_URL="$(./scripts/docs-site-url.sh)" python3 scripts/list-changed-docs.py "${BASE_SHA}" "${HEAD_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: 変更履歴へ1行足す
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 三点リーダーのマージベースを取れるよう、PR の先端も取得する。
          git fetch --no-tags origin "${BASE_SHA}" "${HEAD_SHA}"
          python3 scripts/append-changelog.py
          if git diff --quiet; then
            echo "追記はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ':(glob)apis/*/変更履歴.md' ':(exclude,glob)apis/_*/変更履歴.md' ':(glob)docs/business/*/変更履歴.md' ':(exclude,glob)docs/business/_*/変更履歴.md'
          git commit -m "変更履歴を更新 [changelog]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            # デプロイキーの push は pages.yml を起動するので、ここで呼ばない
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "push に失敗しました" >&2
          exit 1
