name: 変更履歴を追記する

# main への push だけで動く。PR から書き換えたこのファイルは、マージされるまで動かない。
# そのため、main を書き換えられるデプロイキーは、マージ済みの内容でだけ使われる。
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      pages: read
    steps:
      - name: マージしたPRを探す
        # 自分の追記の push は PR に結び付かないので、ここで止まる。
        # コミットのメッセージでは判定しない（squash では PR 本文も入るため）
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0] // empty')"
          if [ -z "$json" ]; then
            echo "PR 経由ではない push なので、追記しません"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "found=true"
            echo "number=$(jq -r .number <<<"$json")"
            echo "base=$(jq -r .base.sha <<<"$json")"
            echo "head=$(jq -r .head.sha <<<"$json")"
            echo "title<<__TITLE__"
            jq -r .title <<<"$json"
            echo "__TITLE__"
          } >> "$GITHUB_OUTPUT"

      - name: mainを取得する
        if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # main はルールで直接 push を禁止している。例外はこのデプロイキーだけ
          ssh-key: ${{ secrets.CHANGELOG_DEPLOY_KEY }}
          # 後の git push でこの鍵を使うので、認証情報を残す（既定と同じ true）
          persist-credentials: true

      - name: 変更したドキュメントを Job Summary に出す
        if: steps.pr.outputs.found == 'true'
        # 表示だけなので、失敗しても変更履歴の追記は続ける
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          GH_TOKEN: ${{ github.token }}
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${BASE_SHA}" "${HEAD_SHA}"
          SITE_URL="$(./scripts/docs-site-url.sh)" python3 scripts/list-changed-docs.py "${BASE_SHA}" "${HEAD_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: 変更履歴へ1行足す
        if: steps.pr.outputs.found == 'true'
        env:
          BASE_SHA: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 三点リーダーのマージベースを取れるよう、PR の先端も取得する。
          git fetch --no-tags origin "${BASE_SHA}" "${HEAD_SHA}"
          python3 scripts/append-changelog.py
          if git diff --quiet; then
            echo "追記はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ':(glob)apis/*/変更履歴.md' ':(exclude,glob)apis/_*/変更履歴.md' ':(glob)docs/business/*/変更履歴.md' ':(exclude,glob)docs/business/_*/変更履歴.md'
          git commit -m "変更履歴を更新 [changelog]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            # デプロイキーの push は pages.yml を起動するので、ここで呼ばない
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "push に失敗しました" >&2
          exit 1
