name: PRタイトルと本文を確認する

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@v4

      - name: タイトルを確認する
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check-pr-title.py

  body:
    runs-on: ubuntu-latest
    steps:
      # PRの中で書き換えたスクリプトではなく、ベースブランチのスクリプトで確かめる（フォークPR対策）
      - name: ベースブランチを取得する
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: 本文を確認する
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # bot の見分け方は user.type だけにそろえ、判定はスクリプトに任せる
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          if [ ! -f scripts/check-pr-body.py ]; then
            # スクリプトが無いと本文を確かめられないため、失敗にする
            {
              echo "## PR本文を確かめられませんでした"
              echo ""
              echo "ベースブランチ（${GITHUB_BASE_REF}）に scripts/check-pr-body.py がありません。"
              echo "ベースブランチにスクリプトを戻すか、スクリプトがあるブランチに向けてPRを出し直してください。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=PR本文を確かめられません::ベースブランチ（${GITHUB_BASE_REF}）に scripts/check-pr-body.py がありません。ベースブランチにスクリプトを戻してください。"
            exit 1
          fi
          python3 scripts/check-pr-body.py
