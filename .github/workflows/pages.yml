name: ドキュメントを公開する

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: PagesのURLを読む
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Pagesが使えないときはジョブを失敗にする
        # 公開できていないことに気づけるよう、飛ばしたまま成功にはしない。
        # Pages の設定は docs/setup.md の手順で、リポジトリの持ち主が変える。
        if: steps.pages.outcome != 'success'
        run: |
          echo "::error::Pagesが使えないため公開できませんでした。Settings → Pages → Source を GitHub Actions にしてください（docs/setup.md）"
          exit 1

      - name: リポジトリを取得する
        if: steps.pages.outcome == 'success'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Pythonを入れる
        if: steps.pages.outcome == 'success'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Javaを入れる
        if: steps.pages.outcome == 'success'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Graphvizと日本語フォントを入れる
        if: steps.pages.outcome == 'success'
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz fonts-noto-cjk

      - name: plantuml.jarを入れる
        if: steps.pages.outcome == 'success'
        run: ./scripts/install-plantuml.sh

      - name: Pythonの依存を入れる
        if: steps.pages.outcome == 'success'
        run: python -m pip install -r requirements.txt

      - name: 図をローカルでSVGにする
        if: steps.pages.outcome == 'success'
        run: ./scripts/render-changed.sh --all >/dev/null

      - name: 原稿へのリンクを作る
        if: steps.pages.outcome == 'success'
        run: ./scripts/prepare-docs.sh

      - name: サイトをビルドする
        if: steps.pages.outcome == 'success'
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          NO_MKDOCS_2_WARNING: "1"
        run: |
          set -euo pipefail
          # mkdocs.yml の site_url: !ENV SITE_URL で読む。末尾は / にそろえる
          case "$SITE_URL" in
            */) ;;
            *) SITE_URL="${SITE_URL}/" ;;
          esac
          export SITE_URL
          mkdocs build --strict

      - name: サイトをアップロードする
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: GitHub Pagesへ公開する
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
