name: PRにPlantUMLの図を載せる

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "**/*.puml"
      - "**/*.plantuml"
      - "**/*.svg"
      - ".github/workflows/plantuml-pr-comment.yml"
      - "scripts/format-plantuml-comment.py"
      - "scripts/post-plantuml-comment.sh"
      - "scripts/highlight-puml-diff.py"

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: PRの先端を取得する
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0

      - name: 比較元を取得する
        run: git fetch origin "${{ github.base_ref }}"

      - name: Javaを入れる
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Graphvizと日本語フォントを入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz fonts-noto-cjk

      - name: plantuml.jarを入れる
        run: ./scripts/install-plantuml.sh

      - name: 変わった図を探す
        id: list
        env:
          BASE_REF: ${{ github.base_ref }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" -- '*.puml' '*.plantuml' \
            > "$RUNNER_TEMP/changed-puml.txt" || true
          if [[ ! -s "$RUNNER_TEMP/changed-puml.txt" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "図の変更はありません"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          if [[ "$IS_FORK" == "true" ]]; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for _ in $(seq 1 24); do
            missing=0
            while IFS= read -r puml; do
              [[ -z "$puml" ]] && continue
              svg="${puml%.*}.svg"
              if [[ ! -f "$svg" ]]; then
                missing=1
                echo "まだありません: $svg"
              fi
            done < "$RUNNER_TEMP/changed-puml.txt"
            if [[ "$missing" -eq 0 ]]; then
              break
            fi
            git fetch origin "$HEAD_BRANCH"
            git checkout --detach "origin/${HEAD_BRANCH}"
            sleep 10
          done
          : > "$RUNNER_TEMP/plantuml-svgs.txt"
          while IFS= read -r puml; do
            [[ -z "$puml" ]] && continue
            svg="${puml%.*}.svg"
            if [[ -f "$svg" ]]; then
              printf '%s\n' "$svg" >> "$RUNNER_TEMP/plantuml-svgs.txt"
            fi
          done < "$RUNNER_TEMP/changed-puml.txt"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 変わった図をローカルでSVGにする（PRで足した・変えた部分を赤くする）
        if: steps.list.outputs.changed == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # リポジトリのSVGは、botの更新前だと古いことがある。
          # コメントには、いまの .puml から作り直したSVGを載せる。
          # このジョブは push しない。色付きの .puml と SVG は、このランナーの中だけで使う。
          mapfile -t changed < "$RUNNER_TEMP/changed-puml.txt"
          : > "$RUNNER_TEMP/highlight-failed.txt"
          if ((${#changed[@]} == 0)); then
            exit 0
          fi
          base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          if ! python3 scripts/highlight-puml-diff.py \
            --base "$base" \
            --summary "$RUNNER_TEMP/plantuml-diff.json" \
            "${changed[@]}"; then
            echo "::warning::差分の色付けに失敗したため、図はふだんの色で載せます"
            git checkout -- "${changed[@]}"
            rm -f "$RUNNER_TEMP/plantuml-diff.json"
          fi
          for puml in "${changed[@]}"; do
            if ! ./scripts/render-puml.sh "$puml"; then
              # 色を付けた形で変換できないときは、元の .puml で作り直す。
              # 元の .puml でも失敗するなら、ここで赤くなる。
              echo "::warning::${puml} は色を付けると変換できないため、ふだんの色で載せます"
              git checkout -- "$puml"
              printf '%s\n' "$puml" >> "$RUNNER_TEMP/highlight-failed.txt"
              ./scripts/render-puml.sh "$puml"
            fi
          done
          : > "$RUNNER_TEMP/plantuml-svgs.txt"
          while IFS= read -r puml; do
            [[ -z "$puml" ]] && continue
            svg="${puml%.*}.svg"
            if [[ -f "$svg" ]]; then
              printf '%s\n' "$svg" >> "$RUNNER_TEMP/plantuml-svgs.txt"
            fi
          done < "$RUNNER_TEMP/changed-puml.txt"
          mapfile -t puml < "$RUNNER_TEMP/changed-puml.txt"
          if ((${#puml[@]} > 0)); then
            ./scripts/render-png.sh "$RUNNER_TEMP/plantuml-png" "${puml[@]}"
          fi

      - name: PNGをアーティファクトにする
        if: steps.list.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plantuml-png
          path: ${{ runner.temp }}/plantuml-png
          if-no-files-found: ignore

      - name: PRに図を載せる
        if: steps.list.outputs.changed == 'true'
        env:
          COMMENT_SHA: ${{ steps.list.outputs.sha || github.event.pull_request.head.sha }}
          FILE_LIST: ${{ runner.temp }}/plantuml-svgs.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DIFF_SUMMARY: ${{ runner.temp }}/plantuml-diff.json
          HIGHLIGHT_FAILED: ${{ runner.temp }}/highlight-failed.txt
          # 画像の添付には個人トークン（PREVIEW_TOKEN）が要る。
          # 無い・期限切れ・権限不足のときは、自動トークンでリンク形式のコメントを書く。
          PREVIEW_TOKEN: ${{ secrets.PREVIEW_TOKEN }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: ./scripts/post-plantuml-comment.sh
