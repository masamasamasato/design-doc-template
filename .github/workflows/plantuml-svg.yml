name: PlantUMLをSVGに変換する

on:
  push:
    paths:
      - "**/*.puml"
      - "**/*.plantuml"
      - "scripts/render-puml.sh"
      - "scripts/render-changed.sh"
      - "scripts/install-plantuml.sh"
      - "scripts/list-changed-puml.sh"
      - ".github/workflows/plantuml-svg.yml"

# GITHUB_TOKEN の push は、次の workflow を起動しない。
# [plantuml-svg] は、トークンを PAT に変えたときもループしないための印。
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: plantuml-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    if: ${{ !contains(github.event.head_commit.message, '[plantuml-svg]') }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Javaを入れる
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Graphvizと日本語フォントを入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz fonts-noto-cjk

      - name: plantuml.jarを入れる
        run: ./scripts/install-plantuml.sh

      - name: 変更された図をSVGにする
        id: render
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./scripts/render-changed.sh "$BEFORE" "$SHA" > "$RUNNER_TEMP/plantuml-svgs.txt"
          status="$(git status --porcelain -uall -- '*.svg' '**/*.svg')"
          if [[ ! -s "$RUNNER_TEMP/plantuml-svgs.txt" && -z "$status" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "図の変更はありません"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: レビュー用のPNGを作る
        if: steps.render.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mapfile -t svgs < "$RUNNER_TEMP/plantuml-svgs.txt"
          puml=()
          for svg in "${svgs[@]}"; do
            puml+=("${svg%.svg}.puml")
          done
          ./scripts/render-png.sh "$RUNNER_TEMP/plantuml-png" "${puml[@]}"

      - name: PNGをアーティファクトにする
        if: steps.render.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plantuml-png
          path: ${{ runner.temp }}/plantuml-png
          if-no-files-found: ignore

      - name: SVGをコミットする
        id: commit
        if: steps.render.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mapfile -t paths < <(git status --porcelain -uall -- '*.svg' '**/*.svg' | cut -c4-)
          if ((${#paths[@]} > 0)); then
            git add -- "${paths[@]}"
          fi
          if git diff --cached --quiet; then
            {
              echo "pushed=false"
              echo "sha=$(git rev-parse HEAD)"
            } >> "$GITHUB_OUTPUT"
            echo "SVGの差分はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "図をSVGに更新 [plantuml-svg] [skip ci]"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              {
                echo "pushed=true"
                echo "sha=$(git rev-parse HEAD)"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 2))
          done
          echo "push に失敗しました" >&2
          exit 1

      - name: PRに図を載せる
        if: steps.render.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          COMMENT_SHA: ${{ steps.commit.outputs.sha || github.sha }}
          FILE_LIST: ${{ runner.temp }}/plantuml-svgs.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require("fs");
            const { execFileSync } = require("child_process");
            const sha = process.env.COMMENT_SHA;
            const body = execFileSync("python3", ["scripts/format-plantuml-comment.py"], {
              encoding: "utf8",
              env: {
                ...process.env,
                COMMENT_SHA: sha,
                RUN_URL: process.env.RUN_URL,
              },
              input: fs.readFileSync(process.env.FILE_LIST, "utf8"),
            });
            const branch = context.ref.replace("refs/heads/", "");
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: "open",
            });
            if (pulls.length === 0) {
              core.info("開いているPRはないため、コメントしません");
              return;
            }
            const marker = "<!-- plantuml-preview -->";
            for (const pull of pulls) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull.number,
              });
              const existing = comments.find((comment) => (comment.body || "").includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
                core.info(`PR #${pull.number} のコメントを更新しました`);
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pull.number,
                  body,
                });
                core.info(`PR #${pull.number} にコメントしました`);
              }
            }
