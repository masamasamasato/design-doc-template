name: PlantUMLをSVGに変換する

on:
  push:
    # main は直接 push を禁止しているので、SVG は PR のブランチで作る
    branches-ignore:
      - main
    paths:
      - "**/*.puml"
      - "**/*.plantuml"
      - "scripts/render-puml.sh"
      - "scripts/render-changed.sh"
      - "scripts/install-plantuml.sh"
      - "scripts/list-changed-puml.sh"
      - ".github/workflows/plantuml-svg.yml"

# GITHUB_TOKEN の push は、次の workflow を起動しない。
# [plantuml-svg] は、トークンを PAT に変えたときもループしないための印。
# PRコメントの図は plantuml-pr-comment.yml だけが書く（ここで書くと、色付きのコメントと競合する）。
permissions:
  contents: write

concurrency:
  group: plantuml-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    if: ${{ !contains(github.event.head_commit.message, '[plantuml-svg]') }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Javaを入れる
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Graphvizと日本語フォントを入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz fonts-noto-cjk

      - name: plantuml.jarを入れる
        run: ./scripts/install-plantuml.sh

      - name: 変更された図をSVGにする
        id: render
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./scripts/render-changed.sh "$BEFORE" "$SHA" > "$RUNNER_TEMP/plantuml-svgs.txt"
          status="$(git -c core.quotepath=false status --porcelain -uall -- '*.svg' '**/*.svg')"
          if [[ ! -s "$RUNNER_TEMP/plantuml-svgs.txt" && -z "$status" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "図の変更はありません"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: レビュー用のPNGを作る
        if: steps.render.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mapfile -t svgs < "$RUNNER_TEMP/plantuml-svgs.txt"
          puml=()
          for svg in "${svgs[@]}"; do
            puml+=("${svg%.svg}.puml")
          done
          ./scripts/render-png.sh "$RUNNER_TEMP/plantuml-png" "${puml[@]}"

      - name: PNGをアーティファクトにする
        if: steps.render.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plantuml-png
          path: ${{ runner.temp }}/plantuml-png
          if-no-files-found: ignore

      - name: SVGをコミットする
        id: commit
        if: steps.render.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mapfile -t paths < <(git -c core.quotepath=false status --porcelain -uall -- '*.svg' '**/*.svg' | cut -c4-)
          if ((${#paths[@]} > 0)); then
            git add -- "${paths[@]}"
          fi
          if git diff --cached --quiet; then
            {
              echo "pushed=false"
              echo "sha=$(git rev-parse HEAD)"
            } >> "$GITHUB_OUTPUT"
            echo "SVGの差分はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "図をSVGに更新 [plantuml-svg]"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              {
                echo "pushed=true"
                echo "sha=$(git rev-parse HEAD)"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 2))
          done
          echo "push に失敗しました" >&2
          exit 1
