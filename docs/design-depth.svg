<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:576px;height:542px;background:#FFFFFF;" width="576px" height="542px" viewBox="0 0 576 542" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="6"><text x="119.357" y="36.24" fill="#000" font-size="14" textLength="335.593" font-weight="700" font-family="'Noto Sans CJK JP'">設計書で扱う深さ（人が書く範囲とAIに任せる範囲）</text></g><rect x="20" y="59.956" width="529.307" height="26.064" fill="none" style="stroke:none;"/><ellipse cx="161.929" cy="101.02" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="40.724" y="131.02" width="242.41" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="50.724" y="154.94" fill="#000" font-size="12" textLength="138.661" font-family="'Noto Sans CJK JP'">深さ1：業務の流れを書く</text><text x="50.724" y="172.316" fill="#000" font-size="12" textLength="204.002" font-family="'Noto Sans CJK JP'">誰が何を渡し、仕事がどこまで進むか</text><text x="50.724" y="189.692" fill="#000" font-size="12" textLength="222.41" font-family="'Noto Sans CJK JP'">例：利用者が公開し、APIが公開中にする</text><rect x="26" y="223.148" width="271.858" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="247.068" fill="#000" font-size="12" textLength="193.069" font-family="'Noto Sans CJK JP'">深さ2：画面とAPIのつながりを書く</text><text x="36" y="264.444" fill="#000" font-size="12" textLength="150.409" font-family="'Noto Sans CJK JP'">どの画面がどのAPIを呼ぶか</text><text x="36" y="281.82" fill="#000" font-size="12" textLength="251.858" font-family="'Noto Sans CJK JP'">例：画面が POST /profiles/{id}/publish を呼ぶ</text><rect x="37.928" y="315.276" width="248.002" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="47.928" y="339.197" fill="#000" font-size="12" textLength="186.661" font-family="'Noto Sans CJK JP'">深さ3：メソッド単位の処理を書く</text><text x="47.928" y="356.573" fill="#000" font-size="12" textLength="198.662" font-family="'Noto Sans CJK JP'">1つの目的を持つ手順と条件分岐まで</text><text x="47.928" y="373.949" fill="#000" font-size="12" textLength="228.002" font-family="'Noto Sans CJK JP'">例：持ち主かつ本人確認済みかを検証する</text><line x1="20" y1="59.956" x2="20" y2="521.533" style="stroke:#000;stroke-width:1.5;"/><rect x="307.858" y="407.405" width="236.434" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="317.858" y="431.325" fill="#000" font-size="12" textLength="204.002" font-family="'Noto Sans CJK JP'">それより細かい処理はコードから読む</text><text x="317.858" y="448.701" fill="#000" font-size="12" textLength="216.434" font-family="'Noto Sans CJK JP'">if文の式やSQLの1行は設計書に書かず、</text><text x="317.858" y="466.077" fill="#000" font-size="12" textLength="120.001" font-family="'Noto Sans CJK JP'">実装を直接読んで扱う</text><ellipse cx="426.075" cy="510.533" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="426.075" cy="510.533" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="301.858" y1="59.956" x2="301.858" y2="521.533" style="stroke:#000;stroke-width:1.5;"/><line x1="548.291" y1="59.956" x2="548.291" y2="521.533" style="stroke:#000;stroke-width:1.5;"/><line x1="161.929" y1="111.02" x2="161.929" y2="131.02" style="stroke:#181818;stroke-width:1;"/><polygon points="157.929,121.02,161.929,131.02,165.929,121.02,161.929,125.02" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="161.929" y1="203.148" x2="161.929" y2="223.148" style="stroke:#181818;stroke-width:1;"/><polygon points="157.929,213.148,161.929,223.148,165.929,213.148,161.929,217.148" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="161.929" y1="295.276" x2="161.929" y2="315.276" style="stroke:#181818;stroke-width:1;"/><polygon points="157.929,305.276,161.929,315.276,165.929,305.276,161.929,309.276" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="426.075" y1="479.533" x2="426.075" y2="499.533" style="stroke:#181818;stroke-width:1;"/><polygon points="422.075,489.533,426.075,499.533,430.075,489.533,426.075,493.533" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="161.929" y1="387.405" x2="161.929" y2="392.405" style="stroke:#181818;stroke-width:1;"/><line x1="161.929" y1="392.405" x2="426.075" y2="392.405" style="stroke:#181818;stroke-width:1;"/><line x1="426.075" y1="392.405" x2="426.075" y2="407.405" style="stroke:#181818;stroke-width:1;"/><polygon points="422.075,397.405,426.075,407.405,430.075,397.405,426.075,401.405" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="88.929" y="80.836" fill="#000" font-size="18" textLength="143.999" font-family="'Noto Sans CJK JP'">人が設計書に書く</text><text x="353.966" y="80.836" fill="#000" font-size="18" textLength="142.217" font-family="'Noto Sans CJK JP'">AIがコードで扱う</text></g></svg>