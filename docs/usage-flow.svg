<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:645px;height:709px;background:#FFFFFF;" width="645px" height="709px" viewBox="0 0 645 709" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="6"><text x="244.906" y="36.24" fill="#000" font-size="14" textLength="153.999" font-weight="700" font-family="'Noto Sans CJK JP'">ドキュメントを書く流れ</text></g><rect x="20" y="59.956" width="598.812" height="26.064" fill="none" style="stroke:none;"/><ellipse cx="178.363" cy="101.02" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="45.872" y="131.02" width="264.982" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="55.872" y="154.94" fill="#000" font-size="12" textLength="186.409" font-family="'Noto Sans CJK JP'">APIや業務フローの型をコピーする</text><text x="55.872" y="172.316" fill="#000" font-size="12" textLength="244.982" font-family="'Noto Sans CJK JP'">apis/_template か docs/business/ の1つを、</text><text x="55.872" y="189.692" fill="#000" font-size="12" textLength="168.001" font-family="'Noto Sans CJK JP'">新しい名前のフォルダにコピー</text><rect x="26" y="223.148" width="304.726" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="247.068" fill="#000" font-size="12" textLength="96.001" font-family="'Noto Sans CJK JP'">設計書と図を書く</text><text x="36" y="264.444" fill="#000" font-size="12" textLength="284.726" font-family="'Noto Sans CJK JP'">APIは処理詳細.md、業務フローは README に書く。</text><text x="36" y="281.82" fill="#000" font-size="12" textLength="249.338" font-family="'Noto Sans CJK JP'">図は .puml で描き、mkdocs serve で確かめる</text><rect x="51.032" y="315.276" width="254.662" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="61.032" y="339.197" fill="#000" font-size="12" textLength="51.216" font-family="'Noto Sans CJK JP'">PRを出す</text><text x="61.032" y="356.573" fill="#000" font-size="12" textLength="234.662" font-family="'Noto Sans CJK JP'">テンプレートに沿って、概要（2行まで）と</text><text x="61.032" y="373.949" fill="#000" font-size="12" textLength="132.001" font-family="'Noto Sans CJK JP'">判断してほしい点を書く</text><rect x="41.816" y="407.405" width="273.094" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="51.816" y="431.325" fill="#000" font-size="12" textLength="156.001" font-family="'Noto Sans CJK JP'">チェックとレビューを受ける</text><text x="51.816" y="448.701" fill="#000" font-size="12" textLength="205.862" font-family="'Noto Sans CJK JP'">CI がタイトル・本文・目次を検証し、</text><text x="51.816" y="466.077" fill="#000" font-size="12" textLength="253.094" font-family="'Noto Sans CJK JP'">レビューする人が内容を確かめて LGTM を出す</text><rect x="76.208" y="499.533" width="204.309" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="86.208" y="523.453" fill="#000" font-size="12" textLength="103.177" font-family="'Noto Sans CJK JP'">main にマージする</text><text x="86.208" y="540.829" fill="#000" font-size="12" textLength="184.309" font-family="'Noto Sans CJK JP'">LGTM が出たら、PR をマージする</text><line x1="20" y1="59.956" x2="20" y2="688.414" style="stroke:#000;stroke-width:1.5;"/><rect x="340.726" y="574.285" width="273.07" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="350.726" y="598.206" fill="#000" font-size="12" textLength="192.001" font-family="'Noto Sans CJK JP'">変更履歴を足し、公開する（自動）</text><text x="350.726" y="615.582" fill="#000" font-size="12" textLength="253.07" font-family="'Noto Sans CJK JP'">触ったAPI・業務フローの変更履歴に1行足し、</text><text x="350.726" y="632.958" fill="#000" font-size="12" textLength="178.477" font-family="'Noto Sans CJK JP'">サイトを公開し直し、PDFを作る</text><ellipse cx="477.261" cy="677.414" rx="1