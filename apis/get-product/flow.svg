ZED</text><ellipse cx="196.617" cy="338.98" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="196.617" cy="338.98" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="79.254,187.444,313.981,187.444,325.981,203.372,313.981,219.3,79.254,219.3,67.254,203.372,79.254,187.444" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="200.617" y="232.06" fill="#000" font-size="11" textLength="83.731" font-family="'Noto Sans CJK JP'">1.2 セッションが</text><text x="200.617" y="247.988" fill="#000" font-size="11" textLength="66" font-family="'Noto Sans CJK JP'">合わない場合</text><text x="79.254" y="200.204" fill="#000" font-size="11" textLength="234.727" font-family="'Noto Sans CJK JP'">Cookie が無い または Cookie のセッションIDが</text><text x="79.254" y="216.132" fill="#000" font-size="11" textLength="219.998" font-family="'Noto Sans CJK JP'">保存済みの有効なセッションと合わない場合</text><text x="325.981" y="184.276" fill="#000" font-size="11" textLength="83.731" font-family="'Noto Sans CJK JP'">1.1 セッションが</text><text x="325.981" y="200.204" fill="#000" font-size="11" textLength="44" font-family="'Noto Sans CJK JP'">合う場合</text><rect x="84.731" y="391.98" width="223.774" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="94.731" y="415.9" fill="#000" font-size="12" textLength="96.685" font-family="'Noto Sans CJK JP'">2. 公開状態の検証</text><text x="94.731" y="433.276" fill="#000" font-size="12" textLength="203.774" font-family="'Noto Sans CJK JP'">商品IDの商品の状態を、公開中と照合</text><path d="M274.246,545.48 L274.246,555.892 L254.246,559.892 L274.246,563.892 L274.246,574.304 A0,0 0 0 0 274.246,574.304 L516.246,574.304 A0,0 0 0 0 516.246,574.304 L516.246,555.48 L506.246,545.48 L274.246,545.48 A0,0 0 0 0 274.246,545.48" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M506.246,545.48 L506.246,555.48 L516.246,555.48 L506.246,545.48" style="stroke:#181818;stroke-width: