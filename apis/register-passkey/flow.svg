<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1170px;height:774px;background:#FFFFFF;" width="1170px" height="774px" viewBox="0 0 1170 774" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="7"><text x="521.085" y="36.24" fill="#000" font-size="14" textLength="125.999" font-weight="700" font-family="'Noto Sans CJK JP'">パスキーを登録する</text></g><path d="M833.744,56.272 L833.744,66.684 L813.744,70.684 L833.744,74.684 L833.744,85.096 A0,0 0 0 0 833.744,85.096 L1149.169,85.096 A0,0 0 0 0 1149.169,85.096 L1149.169,66.272 L1139.169,56.272 L833.744,56.272 A0,0 0 0 0 833.744,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1139.169,56.272 L1139.169,66.272 L1149.169,66.272 L1139.169,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="839.744" y="76.352" fill="#000" font-size="13" textLength="294.424" font-family="'Noto Sans CJK JP'">削除（DELETE）の流れは処理詳細.md の 4 を見る</text><ellipse cx="803.744" cy="70.684" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="627.669" y="105.096" width="352.151" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="637.669" y="129.016" fill="#000" font-size="12" textLength="84.001" font-family="'Noto Sans CJK JP'">セッション検証</text><text x="637.669" y="146.392" fill="#000" font-size="12" textLength="332.151" font-family="'Noto Sans CJK JP'">リクエストの Cookie を、保存済みの有効なセッションと照合</text><text x="637.669" y="163.768" fill="#000" font-size="12" textLength="91.669" font-family="'Noto Sans CJK JP'">requireSession()</text><polygon points="717.51,208.748,889.978,208.748,901.978,220.748,889.978,232.748,717.51,232.748,705.51,220.748,717.51,208.748" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="717.51" y="225.544" fill="#000" font-size="11" textLength="172.468" font-family="'Noto Sans CJK JP'">セッションの Cookie が有効な場合</text><text x="650.511" y="217.58" fill="#000" font-size="11" textLength="55" font-family="'Noto Sans CJK JP'">有効な場合</text><text x="901.978" y="201.652" fill="#000" font-size="11" textLength="150.468" font-family="'Noto Sans CJK JP'">セッションの Cookie が無い、</text><text x="901.978" y="217.58" fill="#000" font-size="11" textLength="87.999" font-family="'Noto Sans CJK JP'">または無効な場合</text><path d="M666.379,246.3 L666.379,266.124 L646.379,270.124 L666.379,274.124 L666.379,293.948 A0,0 0 0 0 666.379,293.948 L941.594,293.948 A0,0 0 0 0 941.594,293.948 L941.594,256.3 L931.594,246.3 L666.379,246.3 A0,0 0 0 0 666.379,246.3" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M931.594,246.3 L931.594,256.3 L941.594,256.3 L931.594,246.3" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="672.379" y="266.38" fill="#000" font-size="13" textLength="254.215" font-family="'Noto Sans CJK JP'">今の利用者に結びつけ、5分だけ保存する。</text><text x="672.379" y="285.204" fill="#000" font-size="13" textLength="252.044" font-family="'Noto Sans CJK JP'">例：登録済みの credential ID も端末へ渡す</text><rect x="434.377" y="242.748" width="212.001" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="444.377" y="266.668" fill="#000" font-size="12" textLength="192.001" font-family="'Noto Sans CJK JP'">登録用のチャレンジを発行する処理</text><text x="444.377" y="284.044" fill="#000" font-size="12" textLength="149.257" font-family="'Noto Sans CJK JP'">issueRegistrationOptions()</text><path d="M669.949,330.464 L669.949,340.876 L649.949,344.876 L669.949,348.876 L669.949,359.288 A0,0 0 0 0 669.949,359.288 L991.21,359.288 A0,0 0 0 0 991.21,359.288 L991.21,340.464 L981.21,330.464 L669.949,330.464 A0,0 0 0 0 669.949,330.464" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M981.21,330.464 L981.21,340.464 L991.21,340.464 L981.21,330.464" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="675.949" y="350.544" fill="#000" font-size="13" textLength="300.261" font-family="'Noto Sans CJK JP'">端末で PIN か生体認証をする。ここはサーバーの外</text><rect x="430.807" y="317.5" width="219.141" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="440.807" y="341.42" fill="#000" font-size="12" textLength="180.001" font-family="'Noto Sans CJK JP'">画面がチャレンジを端末へ渡し、</text><text x="440.807" y="358.796" fill="#000" font-size="12" textLength="199.141" font-family="'Noto Sans CJK JP'">端末が作った attestation を受け取る</text><rect x="342.079" y="392.253" width="396.599" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="352.079" y="416.173" fill="#000" font-size="12" textLength="124.453" font-family="'Noto Sans CJK JP'">attestation 検証と保存</text><text x="352.079" y="433.549" fill="#000" font-size="12" textLength="376.599" font-family="'Noto Sans CJK JP'">チャレンジ・origin・rpId・user verification を照合し、公開鍵を保存</text><text x="352.079" y="450.925" fill="#000" font-size="12" textLength="133.093" font-family="'Noto Sans CJK JP'">verifyAndSavePasskey()</text><polygon points="390.592,491.977,690.164,491.977,702.164,507.905,690.164,523.833,390.592,523.833,378.592,507.905,390.592,491.977" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="390.592" y="504.737" fill="#000" font-size="11" textLength="299.572" font-family="'Noto Sans CJK JP'">attestation が、保存したチャレンジ・origin・rpId と合い、</text><text x="390.592" y="520.665" fill="#000" font-size="11" textLength="140.183" font-family="'Noto Sans CJK JP'">user verification 済みの場合</text><text x="301.593" y="504.737" fill="#000" font-size="11" textLength="76.999" font-family="'Noto Sans CJK JP'">検証が通る場合</text><text x="702.164" y="488.809" fill="#000" font-size="11" textLength="175.999" font-family="'Noto Sans CJK JP'">チャレンジが期限切れ・使用済み、</text><text x="702.164" y="504.737" fill="#000" font-size="11" textLength="120.999" font-family="'Noto Sans CJK JP'">または照合できない場合</text><polygon points="126.222,533.833,270.431,533.833,282.431,545.833,270.431,557.833,126.222,557.833,114.222,545.833,126.222,533.833" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="126.222" y="550.628" fill="#000" font-size="11" textLength="144.209" font-family="'Noto Sans CJK JP'">端末名が30文字を超える場合</text><text x="59.222" y="542.665" fill="#000" font-size="11" textLength="55" font-family="'Noto Sans CJK JP'">超える場合</text><text x="282.431" y="542.665" fill="#000" font-size="11" textLength="89.209" font-family="'Noto Sans CJK JP'">30文字以内の場合</text><rect x="16" y="567.833" width="151.341" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="591.753" fill="#000" font-size="12" textLength="60" font-family="'Noto Sans CJK JP'">失敗を返す</text><text x="26" y="609.129" fill="#000" font-size="12" textLength="131.341" font-family="'Noto Sans CJK JP'">INVALID_DEVICE_NAME</text><path d="M442.623,580.797 L442.623,591.209 L422.623,595.209 L442.623,599.209 L442.623,609.621 A0,0 0 0 0 442.623,609.621 L782.838,609.621 A0,0 0 0 0 782.838,609.621 L782.838,590.797 L772.838,580.797 L442.623,580.797 A0,0 0 0 0 442.623,580.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M772.838,580.797 L772.838,590.797 L782.838,590.797 L772.838,580.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="448.623" y="600.877" fill="#000" font-size="13" textLength="319.215" font-family="'Noto Sans CJK JP'">秘密鍵は受け取らない。1人で複数の端末を登録できる</text><rect x="187.341" y="567.833" width="235.282" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="197.341" y="591.753" fill="#000" font-size="12" textLength="215.282" font-family="'Noto Sans CJK JP'">公開鍵、credential ID、署名カウンタ、</text><text x="197.341" y="609.1