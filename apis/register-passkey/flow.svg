<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1047px;height:710px;background:#FFFFFF;" width="1047px" height="710px" viewBox="0 0 1047 710" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="7"><text x="459.578" y="36.24" fill="#000" font-size="14" textLength="125.999" font-weight="700" font-family="'Noto Sans CJK JP'">パスキーを登録する</text></g><path d="M710.731,56.272 L710.731,66.684 L690.731,70.684 L710.731,74.684 L710.731,85.096 A0,0 0 0 0 710.731,85.096 L1026.156,85.096 A0,0 0 0 0 1026.156,85.096 L1026.156,66.272 L1016.156,56.272 L710.731,56.272 A0,0 0 0 0 710.731,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1016.156,56.272 L1016.156,66.272 L1026.156,66.272 L1016.156,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="716.731" y="76.352" fill="#000" font-size="13" textLength="294.424" font-family="'Noto Sans CJK JP'">削除（DELETE）の流れは処理詳細.md の 4 を見る</text><ellipse cx="680.731" cy="70.684" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="504.656" y="105.096" width="352.151" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="514.656" y="129.016" fill="#000" font-size="12" textLength="84.001" font-family="'Noto Sans CJK JP'">セッション検証</text><text x="514.656" y="146.392" fill="#000" font-size="12" textLength="332.151" font-family="'Noto Sans CJK JP'">リクエストの Cookie を、保存済みの有効なセッションと照合</text><text x="514.656" y="163.768" fill="#000" font-size="12" textLength="91.669" font-family="'Noto Sans CJK JP'">requireSession()</text><polygon points="594.497,208.748,766.965,208.748,778.965,220.748,766.965,232.748,594.497,232.748,582.497,220.748,594.497,208.748" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="594.497" y="225.544" fill="#000" font-size="11" textLength="172.468" font-family="'Noto Sans CJK JP'">セッションの Cookie が有効な場合</text><text x="527.498" y="217.58" fill="#000" font-size="11" textLength="55" font-family="'Noto Sans CJK JP'">有効な場合</text><text x="778.965" y="201.652" fill="#000" font-size="11" textLength="150.468" font-family="'Noto Sans CJK JP'">セッションの Cookie が無い、</text><text x="778.965" y="217.58" fill="#000" font-size="11" textLength="87.999" font-family="'Noto Sans CJK JP'">または無効な場合</text><path d="M543.366,246.3 L543.366,266.124 L523.366,270.124 L543.366,274.124 L543.366,293.948 A0,0 0 0 0 543.366,293.948 L818.581,293.948 A0,0 0 0 0 818.581,293.948 L818.581,256.3 L808.581,246.3 L543.366,246.3 A0,0 0 0 0 543.366,246.3" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M808.581,246.3 L808.581,256.3 L818.581,256.3 L808.581,246.3" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="549.366" y="266.38" fill="#000" font-size="13" textLength="254.215" font-family="'Noto Sans CJK JP'">今の利用者に結びつけ、5分だけ保存する。</text><text x="549.366" y="285.204" fill="#000" font-size="13" textLength="252.044" font-family="'Noto Sans CJK JP'">例：登録済みの credential ID も端末へ渡す</text><rect x="311.364" y="242.748" width="212.001" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="321.364" y="266.668" fill="#000" font-size="12" textLength="192.001" font-family="'Noto Sans CJK JP'">登録用のチャレンジを発行する処理</text><text x="321.364" y="284.044" fill="#000" font-size="12" textLength="149.257" font-family="'Noto Sans CJK JP'">issueRegistrationOptions()</text><path d="M546.936,330.464 L546.936,340.876 L526.936,344.876 L546.936,348.876 L546.936,359.288 A0,0 0 0 0 546.936,359.288 L868.197,359.288 A0,0 0 0 0 868.197,359.288 L868.197,340.464 L858.197,330.464 L546.936,330.464 A0,0 0 0 0 546.936,330.464" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M858.197,330.464 L858.197,340.464 L868.197,340.464 L858.197,330.464" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="552.936" y="350.544" fill="#000" font-size="13" textLength="300.261" font-family="'Noto Sans CJK JP'">端末で PIN か生体認証をする。ここはサーバーの外</text><rect x="307.794" y="317.5" width="219.141" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="317.794" y="341.42" fill="#000" font-size="12" textLength="180.001" font-family="'Noto Sans CJK JP'">画面がチャレンジを端末へ渡し、</text><text x="317.794" y="358.796" fill="#000" font-size="12" textLength="199.141" font-family="'Noto Sans CJK JP'">端末が作った attestation を受け取る</text><rect x="219.066" y="392.253" width="396.599" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="229.066" y="416.173" fill="#000" font-size="12" textLength="124.453" font-family="'Noto Sans CJK JP'">attestation 検証と保存</text><text x="229.066" y="433.549" fill="#000" font-size="12" textLength="376.599" font-family="'Noto Sans CJK JP'">チャレンジ・origin・rpId・user verification を照合し、公開鍵を保存</text><text x="229.066" y="450.925" fill="#000" font-size="12" textLength="133.093" font-family="'Noto Sans CJK JP'">verifyAndSavePasskey()</text><polygon points="267.579,491.977,567.151,491.977,579.151,507.905,567.151,523.833,267.579,523.833,255.579,507.905,267.579,491.977" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="267.579" y="504.737" fill="#000" font-size="11" textLength="299.572" font-family="'Noto Sans CJK JP'">attestation が、保存したチャレンジ・origin・rpId と合い、</text><text x="267.579" y="520.665" fill="#000" font-size="11" textLength="140.183" font-family="'Noto Sans CJK JP'">user verification 済みの場合</text><text x="178.58" y="504.737" fill="#000" font-size="11" textLength="76.999" font-family="'Noto Sans CJK JP'">検証が通る場合</text><text x="579.151" y="488.809" fill="#000" font-size="11" textLength="175.999" font-family="'Noto Sans CJK JP'">チャレンジが期限切れ・使用済み、</text><text x="579.151" y="504.737" fill="#000" font-size="11" textLength="120.999" font-family="'Noto Sans CJK JP'">または照合できない場合</text><path d="M271.282,546.797 L271.282,557.209 L251.282,561.209 L271.282,565.209 L271.282,575.621 A0,0 0 0 0 271.282,575.621 L611.497,575.621 A0,0 0 0 0 611.497,575.621 L611.497,556.797 L601.497,546.797 L271.282,546.797 A0,0 0 0 0 271.282,546.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M601.497,546.797 L601.497,556.797 L611.497,556.797 L601.497,546.797" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="277.282" y="566.877" fill="#000" font-size="13" textLength="319.215" font-family="'Noto Sans CJK JP'">秘密鍵は受け取らない。1人で複数の端末を登録できる</text><rect x="16" y="533.833" width="235.282" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="557.753" fill="#000" font-size="12" textLength="215.282" font-family="'Noto Sans CJK JP'">公開鍵、credential ID、署名カウンタ、</text><text x="26" y="575.129" fill="#000" font-size="12" textLength="96.001" font-family="'Noto Sans CJK JP'">端末名を保存する</text><rect x="631.497" y="533.833" width="139.185" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="641.497" y="557.753" fill="#000" font-size="12" textLength="60" font-family="'Noto Sans CJK JP'">失敗を返す</text><text x="641.497" y="575.129" fill="#000" font-size="12" textLength="119.185" font-family="'Noto Sans CJK JP'">INVALID_CHALLENGE</text><polygon points="417.365,594.585,429.365,606.585,417.365,618.585,405.365,606.585,417.365,594.585" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="888.197" y="242.748" width="111.801" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="898.197" y="266.668" fill="#000" font-size="12" textLength="60" font-family="'Noto Sans CJK JP'">失敗を返す</text><text x="898.197" y="284.044" fill="#000"