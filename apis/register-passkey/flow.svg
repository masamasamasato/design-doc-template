<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1765px;height:810px;background:#FFFFFF;" width="1765px" height="810px" viewBox="0 0 1765 810" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="8"><text x="818.61" y="36.24" fill="#000" font-size="14" textLength="125.999" font-weight="700" font-family="'Noto Sans CJK JP'">パスキーを登録する</text></g><path d="M1132.743,56.272 L1132.743,76.096 L1112.743,80.096 L1132.743,84.096 L1132.743,103.92 A0,0 0 0 0 1132.743,103.92 L1448.167,103.92 A0,0 0 0 0 1448.167,103.92 L1448.167,66.272 L1438.167,56.272 L1132.743,56.272 A0,0 0 0 0 1132.743,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M1438.167,56.272 L1438.167,66.272 L1448.167,66.272 L1438.167,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="1138.743" y="76.352" fill="#000" font-size="13" textLength="261.729" font-family="'Noto Sans CJK JP'">1回目の呼び出し POST /passkeys/options。</text><text x="1138.743" y="95.176" fill="#000" font-size="13" textLength="294.424" font-family="'Noto Sans CJK JP'">削除（DELETE）の流れは処理詳細.md の 4 を見る</text><ellipse cx="1102.743" cy="80.096" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="926.667" y="123.92" width="352.151" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="936.667" y="147.84" fill="#000" font-size="12" textLength="84.001" font-family="'Noto Sans CJK JP'">セッション検証</text><text x="936.667" y="165.216" fill="#000" font-size="12" textLength="332.151" font-family="'Noto Sans CJK JP'">リクエストの Cookie を、保存済みの有効なセッションと照合</text><text x="936.667" y="182.592" fill="#000" font-size="12" textLength="91.669" font-family="'Noto Sans CJK JP'">requireSession()</text><polygon points="1016.509,227.572,1188.977,227.572,1200.977,239.572,1188.977,251.572,1016.509,251.572,1004.509,239.572,1016.509,227.572" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1016.509" y="244.368" fill="#000" font-size="11" textLength="172.468" font-family="'Noto Sans CJK JP'">セッションの Cookie が有効な場合</text><text x="949.509" y="236.404" fill="#000" font-size="11" textLength="55" font-family="'Noto Sans CJK JP'">有効な場合</text><text x="1200.977" y="220.476" fill="#000" font-size="11" textLength="150.468" font-family="'Noto Sans CJK JP'">セッションの Cookie が無い、</text><text x="1200.977" y="236.404" fill="#000" font-size="11" textLength="87.999" font-family="'Noto Sans CJK JP'">または無効な場合</text><path d="M812.5,265.124 L812.5,284.948 L792.5,288.948 L812.5,292.948 L812.5,312.772 A0,0 0 0 0 812.5,312.772 L1217.715,312.772 A0,0 0 0 0 1217.715,312.772 L1217.715,275.124 L1207.715,265.124 L812.5,265.124 A0,0 0 0 0 812.5,265.124" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M1207.715,265.124 L1207.715,275.124 L1217.715,275.124 L1207.715,265.124" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="818.5" y="285.204" fill="#000" font-size="13" textLength="384.215" font-family="'Noto Sans CJK JP'">保存：今の利用者に結びつけたチャレンジ（例：5分で消える）。</text><text x="818.5" y="304.028" fill="#000" font-size="13" textLength="252.044" font-family="'Noto Sans CJK JP'">例：登録済みの credential ID も端末へ渡す</text><rect x="580.499" y="261.572" width="212.001" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="590.499" y="285.492" fill="#000" font-size="12" textLength="192.001" font-family="'Noto Sans CJK JP'">登録用のチャレンジを発行する処理</text><text x="590.499" y="302.868" fill="#000" font-size="12" textLength="149.257" font-family="'Noto Sans CJK JP'">issueRegistrationOptions()</text><path d="M816.07,339.876 L816.07,359.7 L796.07,363.7 L816.07,367.7 L816.07,387.524 A0,0 0 0 0 816.07,387.524 L1255.397,387.524 A0,0 0 0 0 1255.397,387.524 L1255.397,349.876 L1245.397,339.876 L816.07,339.876 A0,0 0 0 0 816.07,339.876" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M1245.397,339.876 L1245.397,349.876 L1255.397,349.876 L1245.397,339.876" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="822.07" y="359.956" fill="#000" font-size="13" textLength="313.261" font-family="'Noto Sans CJK JP'">端末で PIN か生体認証をする。ここはサーバーの外。</text><text x="822.07" y="378.78" fill="#000" font-size="13" textLength="418.327" font-family="'Noto Sans CJK JP'">次は2回目の呼び出し POST /passkeys（セッション検証も同じくする）</text><rect x="576.929" y="336.324" width="219.141" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="586.929" y="360.244" fill="#000" font-size="12" textLength="180.001" font-family="'Noto Sans CJK JP'">画面がチャレンジを端末へ渡し、</text><text x="586.929" y="377.621" fill="#000" font-size="12" textLength="199.141" font-family="'Noto Sans CJK JP'">端末が作った attestation を受け取る</text><rect x="487.75" y="411.077" width="397.499" height="89.504" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="497.75" y="434.997" fill="#000" font-size="12" textLength="88.453" font-family="'Noto Sans CJK JP'">attestation 検証</text><text x="497.75" y="452.373" fill="#000" font-size="12" textLength="377.499" font-family="'Noto Sans CJK JP'">attestation を、保存したチャレンジ・自社の origin・rpId と照合し、</text><text x="497.75" y="469.749" fill="#000" font-size="12" textLength="176.929" font-family="'Noto Sans CJK JP'">user verification のフラグを見る</text><text x="497.75" y="487.125" fill="#000" font-size="12" textLength="133.093" font-family="'Noto Sans CJK JP'">verifyAndSavePasskey()</text><polygon points="545.662,528.177,827.337,528.177,839.337,544.105,827.337,560.033,545.662,560.033,533.662,544.105,545.662,528.177" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="545.662" y="540.937" fill="#000" font-size="11" textLength="259.103" font-family="'Noto Sans CJK JP'">チャレンジが今の利用者のもので5分以内・未使用、</text><text x="545.662" y="556.865" fill="#000" font-size="11" textLength="281.675" font-family="'Noto Sans CJK JP'">origin・rpId が自社と合い、user verification 済みの場合</text><text x="456.662" y="540.937" fill="#000" font-size="11" textLength="76.999" font-family="'Noto Sans CJK JP'">検証が通る場合</text><text x="839.337" y="525.009" fill="#000" font-size="11" textLength="307.998" font-family="'Noto Sans CJK JP'">チャレンジが無い・期限切れ・使用済み・他の利用者のもの、</text><text x="839.337" y="540.937" fill="#000" font-size="11" textLength="306.139" font-family="'Noto Sans CJK JP'">origin・rpId が合わない、または user verification が無い場合</text><polygon points="248.07,570.033,392.279,570.033,404.279,582.033,392.279,594.033,248.07,594.033,236.07,582.033,248.07,570.033" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="248.07" y="586.829" fill="#000" font-size="11" textLength="144.209" font-family="'Noto Sans CJK JP'">端末名が30文字を超える場合</text><text x="181.07" y="578.865" fill="#000" font-size="11" textLength="55" font-family="'Noto Sans CJK JP'">超える場合</text><text x="404.279" y="578.865" fill="#000" font-size="11" textLength="89.209" font-family="'Noto Sans CJK JP'">30文字以内の場合</text><path d="M210.009,616.997 L210.009,627.409 L190.009,631.409 L210.009,635.409 L210.009,645.821 A0,0 0 0 0 210.009,645.821 L478.009,645.821 A0,0 0 0 0 478.009,645.821 L478.009,626.997 L468.009,616.997 L210.009,616.997 A0,0 0 0 0 210.009,616.997" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M468.009,616.997 L468.009,626.997 L478.009,626.997 L468.009,616.997" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="216.009" y="637.077" fill="#000" font-size="13" textLength="247" font-family="'Noto Sans CJK JP'">削除：チャレンジ。パスキーは保存しない</text><rect x="16" y="604.033" width="174.009" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="627.953" fill="#000" font-size="12" textLen