<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:847px;height:1138px;background:#FFFFFF;" width="847px" height="1138px" viewBox="0 0 847 1138" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="7"><text x="376.408" y="36.24" fill="#000" font-size="14" textLength="92.932" font-weight="700" font-family="'Noto Sans CJK JP'">（APIの名前）</text></g><ellipse cx="366.014" cy="66.272" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="277.671" y="96.272" width="176.685" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="287.671" y="120.192" fill="#000" font-size="12" textLength="156.685" font-family="'Noto Sans CJK JP'">1. リクエストバリデーション</text><text x="287.671" y="137.568" fill="#000" font-size="12" textLength="96.001" font-family="'Noto Sans CJK JP'">項目を条件と照合</text><path d="M504.878,257.368 L504.878,267.78 L484.878,271.78 L504.878,275.78 L504.878,286.192 A0,0 0 0 0 504.878,286.192 L616.879,286.192 A0,0 0 0 0 616.879,286.192 L616.879,267.368 L606.879,257.368 L504.878,257.368 A0,0 0 0 0 504.878,257.368" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M606.879,257.368 L606.879,267.368 L616.879,267.368 L606.879,257.368" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="510.878" y="277.448" fill="#000" font-size="13" textLength="91" font-family="'Noto Sans CJK JP'">何も保存しない</text><rect x="247.149" y="244.404" width="237.73" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="257.149" y="268.324" fill="#000" font-size="12" textLength="60" font-family="'Noto Sans CJK JP'">失敗を返す</text><text x="257.149" y="285.7" fill="#000" font-size="12" textLength="217.73" font-family="'Noto Sans CJK JP'">400 （コード）。例: INVALID_REQUEST</text><ellipse cx="366.014" cy="330.156" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="366.014" cy="330.156" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="283.514,178.62,448.513,178.62,460.513,194.548,448.513,210.476,283.514,210.476,271.514,194.548,283.514,178.62" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="370.014" y="223.236" fill="#000" font-size="11" textLength="105.731" font-family="'Noto Sans CJK JP'">1.2 いずれかの項目が</text><text x="370.014" y="239.164" fill="#000" font-size="11" textLength="66" font-family="'Noto Sans CJK JP'">合わない場合</text><text x="283.514" y="191.38" fill="#000" font-size="11" textLength="164.999" font-family="'Noto Sans CJK JP'">リクエストのいずれかの項目が、</text><text x="283.514" y="207.308" fill="#000" font-size="11" textLength="138.104" font-family="'Noto Sans CJK JP'">手順1の条件に合わない場合</text><text x="460.513" y="175.452" fill="#000" font-size="11" textLength="94.731" font-family="'Noto Sans CJK JP'">1.1 すべての項目が</text><text x="460.513" y="191.38" fill="#000" font-size="11" textLength="44" font-family="'Noto Sans CJK JP'">合う場合</text><rect x="211.671" y="383.156" width="308.686" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="221.671" y="407.076" fill="#000" font-size="12" textLength="72.685" font-family="'Noto Sans CJK JP'">2. （〜検証）</text><text x="221.671" y="424.452" fill="#000" font-size="12" textLength="288.686" font-family="'Noto Sans CJK JP'">（何と何を照合するかを1行）。例: 持ち主と本人確認</text><path d="M529.383,528.692 L529.383,539.104 L509.383,543.104 L529.383,547.104 L529.383,557.516 A0,0 0 0 0 529.383,557.516 L764.909,557.516 A0,0 0 0 0 764.909,557.516 L764.909,538.692 L754.909,528.692 L529.383,528.692 A0,0 0 0 0 529.383,528.692" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M754.909,528.692 L754.909,538.692 L764.909,538.692 L754.909,528.692" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="535.383" y="548.772" fill="#000" font-size="13" textLength="214.526" font-family="'Noto Sans CJK JP'">（保存・削除）。例: 何も保存しない</text><rect x="222.645" y="515.728" width="286.738" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="232.645" y="539.648" fill="#000" font-size="12" textLength="60" font-family="'Noto Sans CJK JP'">失敗を返す</text><text x="232.645" y="557.024" fill="#000" font-size="12" textLength="266.738" font-family="'Noto Sans CJK JP'">（ステータスとコード）。例: 403 NOT_VERIFIED</text><ellipse cx="366.014" cy="601.48" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="366.014" cy="601.48" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="194.745,457.908,537.283,457.908,549.283,473.836,537.283,489.764,194.745,489.764,182.745,473.836,194.745,457.908" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="370.014" y="502.524" fill="#000" font-size="11" textLength="83.731" font-family="'Noto Sans CJK JP'">2.2 （〜の場合）</text><text x="194.745" y="470.668" fill="#000" font-size="11" textLength="342.538" font-family="'Noto Sans CJK JP'">(何が何と合わない〜の場合)。例: 利用者IDが持ち主IDと一致しない、</text><text x="194.745" y="486.596" fill="#000" font-size="11" textLength="219.998" font-family="'Noto Sans CJK JP'">または利用者の本人確認が済んでいない場合</text><text x="549.283" y="470.668" fill="#000" font-size="11" textLength="83.731" font-family="'Noto Sans CJK JP'">2.1 （〜の場合）</text><rect x="256.683" y="654.48" width="218.662" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="266.683" y="678.4" fill="#000" font-size="12" textLength="139.093" font-family="'Noto Sans CJK JP'">3. （外部APIを呼ぶ手順）</text><text x="266.683" y="695.776" fill="#000" font-size="12" textLength="198.662" font-family="'Noto Sans CJK JP'">（何を送り、何を受け取るかを1行）</text><path d="M465.218,723.372 L465.218,752.608 L445.218,756.608 L465.218,760.608 L465.218,789.844 A0,0 0 0 0 465.218,789.844 L694.959,789.844 A0,0 0 0 0 694.959,789.844 L694.959,733.372 L684.959,723.372 L465.218,723.372 A0,0 0 0 0 465.218,723.372" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M684.959,723.372 L684.959,733.372 L694.959,733.372 L684.959,723.372" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="471.218" y="743.452" fill="#000" font-size="13" textLength="163.215" font-family="'Noto Sans CJK JP'">タイムアウト：（例：3秒）</text><text x="471.218" y="762.276" fill="#000" font-size="13" textLength="208.741" font-family="'Noto Sans CJK JP'">再試行：（例: しない（例：0回））</text><text x="471.218" y="781.1" fill="#000" font-size="13" textLength="195" font-family="'Noto Sans CJK JP'">失敗時：（ステータスとコード）</text><rect x="286.809" y="729.232" width="158.409" height="54.752" fill="#E3F2FD" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="296.809" y="753.152" fill="#000" font-size="12" textLength="138.409" font-family="'Noto Sans CJK JP'">外部API：（サービス名）</text><text x="296.809" y="770.529" fill="#000" font-size="12" textLength="78.661" font-family="'Noto Sans CJK JP'">（役割を1行）</text><polygon points="37,821.368,270.264,821.368,282.264,833.368,270.264,845.368,37,845.368,25,833.368,37,821.368" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="157.632" y="858.128" fill="#000" font-size="11" textLength="111.88" font-family="'Noto Sans CJK JP'">3.2 HTTPステータスが</text><text x="157.632" y="874.056" fill="#000" font-size="11" textLength="53.779" font-family="'Noto Sans CJK JP'">404 の場合</text><text x="37" y="838.164" fill="#000" font-size="11" textLength="233.264" font-family="'Noto Sans CJK JP'">外部APIの返事のHTTPステータスが 404 の場合</text><rect x="50.991" y="897.224" width="205.281" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="60.991" y="921.144" fill="#000" font-size="12" textLength="60" font-family="'Noto Sans CJK JP'">失敗を返す</text><text x="60.991" y="938.52" fill="#000" font-size="12" textLength="185.281" font-family="'Noto Sans CJK JP'">404 （コード）。例: NOT_FOUND</text><ellipse cx="153.632" cy="986.904" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="153.632" cy="986.904" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="314.264,817.44,609.843,817.44,621.843,833.368,609.843,849.296,314.264,849.296,302.264,833.368,314.264,817.44" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="466.054" y="862.056" fill="#000" font-size="11" textLength="194.974" font-family="'Noto Sans CJK JP'">3.3 HTTPステータスが200・404 以外、</text><text x="466.054" y="877.984" fill="#000" font-size="11" textLength="109.999" font-family="'Noto Sans CJK JP'">または返事が無い場合</text><text x="314.264" y="830.2" fill="#000" font-size="11" textLength="295.579" font-family="'Noto Sans CJK JP'">外部APIの返事のHTTPステータスが 200・404 以外の場合、</text><text x="314.264" y="846.128" fill="#000" font-size="11" textLength="170.873" font-family="'Noto Sans CJK JP'">または外部APIから返事が無い場合</text><text x="621.843" y="814.272" fill="#000" font-size="11" textLength="111.88" font-family="'Noto Sans CJK JP'">3.1 HTTPステータスが</text><text x="621.843" y="830.2" fill="#000" font-size="11" textLength="53.779" font-family="'Noto Sans CJK JP'">200 の場合</text><rect x="330.055" y="901.152" width="263.998" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="340.055" y="925.072" fill="#000" font-size="12" textLength="60" font-family="'Noto Sans CJK JP'">失敗を返す</text><text x="340.055" y="942.448" fill="#000" font-size="12" textLength="243.998" font-family="'Noto Sans CJK JP'">503 （コード）。例: SERVICE_UNAVAILABLE</text><ellipse cx="462.054" cy="990.832" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="462.054" cy="990.832" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width: