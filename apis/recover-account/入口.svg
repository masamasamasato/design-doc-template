h:1;"/><text x="316.874" y="191.448" fill="#000" font-size="13" textLength="147.654" font-family="'Noto Sans CJK JP'">POST /account-recovery</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg3" data-source-line="15"><line x1="697.875" y1="248.84" x2="739.875" y2="248.84" style="stroke:#181818;stroke-width:1;"/><line x1="739.875" y1="248.84" x2="739.875" y2="261.84" style="stroke:#181818;stroke-width:1;"/><line x1="698.875" y1="261.84" x2="739.875" y2="261.84" style="stroke:#181818;stroke-width:1;"/><polygon points="708.875,257.84,698.875,261.84,708.875,265.84,704.875,261.84" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="704.875" y="224.272" fill="#000" font-size="13" textLength="273" font-family="'Noto Sans CJK JP'">依頼回数の上限検証のあと、確認リンクを送る</text><text x="704.875" y="243.096" fill="#000" font-size="13" textLength="110.929" font-family="'Noto Sans CJK JP'">requestRecovery()</text></g><path d="M13,273.84 L75.251,273.84 L75.251,284.664 L65.251,294.664 L13,294.664 L13,273.84" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="13" y="273.84" width="992.875" height="796.416" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="28" y="289.92" fill="#000" font-size="13" textLength="17.251" font-weight="700" font-family="'Noto Sans CJK JP'">alt</text><text x="90.251" y="288.6" fill="#000" font-size="11" textLength="397.24" font-weight="700" font-family="'Noto Sans CJK JP'">[過去1時間で、同じメールアドレス宛が3回、または同じIPが10回を超えた場合]</text><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg4" data-source-line="17"><polygon points="320.874,345.24,310.874,349.24,320.874,353.24,316.874,349.24" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="314.874" y1="349.24" x2="696.875" y2="349.24" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="326.874" y="324.672" fill="#000" font-size="13" textLength="166.803" font-family="'Noto Sans CJK JP'">429 TOO_MANY_REQUESTS</text><text x="326.874" y="343.496" fill="#000" font-size="13" textLength="255.177" font-family="'Noto Sans CJK JP'">Retry-After（最長1時間）。何も保存しない</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg5" data-source-line="18"><polygon points="59,378.064,49,382.064,59,386.064,55,382.064" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="382.064" x2="308.874" y2="382.064" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="376.32" fill="#000" font-size="13" textLength="237.874" font-family="'Noto Sans CJK JP'">Retry-After の秒数がたってから依頼する</text></g><line x1="13" y1="391.064" x2="1005.875" y2="391.064" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="18" y="405.824" fill="#000" font-size="11" textLength="74.315" font-weight="700" font-family="'Noto Sans CJK JP'">[上限内の場合]</text><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg6" data-source-line="20"><polygon points="320.874,451.64,310.874,455.64,320.874,459.64,316.874,455.64" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="314.874" y1="455.64" x2="696.875" y2="455.64" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="326.874" y="431.072" fill="#000" font-size="13" textLength="21.645" font-family="'Noto Sans CJK JP'">200</text><text x="326.874" y="449.896" fill="#000" font-size="13" textLength="364" font-family="'Noto Sans CJK JP'">依頼回数とトークンのハッシュを保存し、前のトークンを消す</text></g><path d="M314.874,468.64 L314.874,515.64 L582.874,515.64 L582.874,478.64 L572.874,468.64 L314.874,468.64" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M572.874,468.64 L572.874,478.64 L582.874,478.64 L572.874,468.64" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="320.874" y="488.72" fill="#000" font-size="13" textLength="232.557" font-fam