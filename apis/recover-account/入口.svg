nt-family="'Noto Sans CJK JP'">429 TOO_MANY_REQUESTS</text><text x="326.874" y="343.496" fill="#000" font-size="13" textLength="255.177" font-family="'Noto Sans CJK JP'">Retry-After（最長1時間）。何も保存しない</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg5" data-source-line="18"><polygon points="59,378.064,49,382.064,59,386.064,55,382.064" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="382.064" x2="308.874" y2="382.064" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="376.32" fill="#000" font-size="13" textLength="237.874" font-family="'Noto Sans CJK JP'">Retry-After の秒数がたってから依頼する</text></g><line x1="13" y1="391.064" x2="1019.616" y2="391.064" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="18" y="405.824" fill="#000" font-size="11" textLength="406.744" font-weight="700" font-family="'Noto Sans CJK JP'">[同じメールアドレス宛の依頼が3回以内 かつ 同じIPからの依頼が10回以内の場合]</text><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg6" data-source-line="20"><polygon points="320.874,451.64,310.874,455.64,320.874,459.64,316.874,455.64" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="314.874" y1="455.64" x2="696.875" y2="455.64" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="326.874" y="431.072" fill="#000" font-size="13" textLength="35.386" font-family="'Noto Sans CJK JP'">3. 200</text><text x="326.874" y="449.896" fill="#000" font-size="13" textLength="364" font-family="'Noto Sans CJK JP'">依頼回数とトークンのハッシュを保存し、前のトークンを消す</text></g><path d="M314.874,468.64 L314.874,515.64 L582.874,515.64 L582.874,478.64 L572.874,468.64 L314.874,468.64" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M572.874,468.64 L572.874,478.64 L582.874,478.64 L572.874,468.64" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="320.874" y="488.72" fill="#000" font-size="1