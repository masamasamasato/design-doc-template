"part3" id="msg12" data-source-line="28"><line x1="697.875" y1="828.456" x2="739.875" y2="828.456" style="stroke:#181818;stroke-width:1;"/><line x1="739.875" y1="828.456" x2="739.875" y2="841.456" style="stroke:#181818;stroke-width:1;"/><line x1="698.875" y1="841.456" x2="739.875" y2="841.456" style="stroke:#181818;stroke-width:1;"/><polygon points="708.875,837.456,698.875,841.456,708.875,845.456,704.875,841.456" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="704.875" y="803.888" fill="#000" font-size="13" textLength="169" font-family="'Noto Sans CJK JP'">新しいセッションを保存する</text><text x="704.875" y="822.712" fill="#000" font-size="13" textLength="93.587" font-family="'Noto Sans CJK JP'">createSession()</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg13" data-source-line="29"><polygon points="320.874,889.104,310.874,893.104,320.874,897.104,316.874,893.104" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="314.874" y1="893.104" x2="696.875" y2="893.104" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="326.874" y="868.536" fill="#000" font-size="13" textLength="186.472" font-family="'Noto Sans CJK JP'">200 Cookie でセッションを返す</text><text x="326.874" y="887.36" fill="#000" font-size="13" textLength="156" font-family="'Noto Sans CJK JP'">トークンを使用済みにする</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg14" data-source-line="30"><polygon points="59,921.928,49,925.928,59,929.928,55,925.928" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="53" y1="925.928" x2="308.874" y2="925.928" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="65" y="920.184" fill="#000" font-size="13" textLength="208" font-family="'Noto Sans CJK JP'">復旧できた。パスキーを登録し直す</text></g><line x1="32" y1="934.928" x2="980.875" y2="934.928" style="s