<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1739px;height:915px;background:#FFFFFF;" width="1739px" height="915px" viewBox="0 0 1739 915" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="8"><text x="798.568" y="36.24" fill="#000" font-size="14" textLength="139.999" font-weight="700" font-family="'Noto Sans CJK JP'">アカウントを復旧する</text></g><path d="M845.593,56.272 L845.593,66.684 L825.593,70.684 L845.593,74.684 L845.593,85.096 A0,0 0 0 0 845.593,85.096 L1125.462,85.096 A0,0 0 0 0 1125.462,85.096 L1125.462,66.272 L1115.462,56.272 L845.593,56.272 A0,0 0 0 0 845.593,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M1115.462,56.272 L1115.462,66.272 L1125.462,66.272 L1115.462,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="851.593" y="76.352" fill="#000" font-size="13" textLength="258.869" font-family="'Noto Sans CJK JP'">1回目の呼び出し。POST /account-recovery</text><ellipse cx="815.593" cy="70.684" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="624.715" y="105.096" width="381.755" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="634.715" y="129.016" fill="#000" font-size="12" textLength="108.001" font-family="'Noto Sans CJK JP'">依頼回数の上限検証</text><text x="634.715" y="146.392" fill="#000" font-size="12" textLength="361.755" font-family="'Noto Sans CJK JP'">過去1時間の依頼回数を、メアドごと3回・IPごと10回の上限と照合</text><text x="634.715" y="163.768" fill="#000" font-size="12" textLength="102.397" font-family="'Noto Sans CJK JP'">requestRecovery()</text><polygon points="693.989,204.82,937.197,204.82,949.197,220.748,937.197,236.676,693.989,236.676,681.989,220.748,693.989,204.82" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="693.989" y="217.58" fill="#000" font-size="11" textLength="243.208" font-family="'Noto Sans CJK JP'">過去1時間で、同じメールアドレス宛が3回以内、</text><text x="693.989" y="233.508" fill="#000" font-size="11" textLength="143.395" font-family="'Noto Sans CJK JP'">かつ同じIPが10回以内の場合</text><text x="615.989" y="217.58" fill="#000" font-size="11" textLength="66" font-family="'Noto Sans CJK JP'">上限内の場合</text><text x="949.197" y="201.652" fill="#000" font-size="11" textLength="193.104" font-family="'Noto Sans CJK JP'">同じメールアドレス宛が3回を超えた、</text><text x="949.197" y="217.58" fill="#000" font-size="11" textLength="165.395" font-family="'Noto Sans CJK JP'">または同じIPが10回を超えた場合</text><path d="M531.127,246.676 L531.127,275.912 L511.127,279.912 L531.127,283.912 L531.127,313.148 A0,0 0 0 0 531.127,313.148 L1078.653,313.148 A0,0 0 0 0 1078.653,313.148 L1078.653,256.676 L1068.653,246.676 L531.127,246.676 A0,0 0 0 0 531.127,246.676" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M1068.653,246.676 L1068.653,256.676 L1078.653,256.676 L1068.653,246.676" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="537.127" y="266.756" fill="#000" font-size="13" textLength="300.43" font-family="'Noto Sans CJK JP'">保存：依頼回数を1増やす（例：1時間で消える）。</text><text x="537.127" y="285.58" fill="#000" font-size="13" textLength="526.526" font-family="'Noto Sans CJK JP'">登録済みのメールアドレスなら、トークンの SHA-256 ハッシュ（例：15分で期限切れ）。</text><text x="537.127" y="304.404" fill="#000" font-size="13" textLength="284.557" font-family="'Noto Sans CJK JP'">削除：前のトークン。未登録でも応答は同じ 200</text><rect x="347.126" y="252.536" width="164.001" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="357.126" y="276.456" fill="#000" font-size="12" textLength="144.001" font-family="'Noto Sans CJK JP'">確認リンクを発行する処理</text><text x="357.126" y="293.832" fill="#000" font-size="12" textLength="102.397" font-family="'Noto Sans CJK JP'">requestRecovery()</text><path d="M543.127,337.424 L543.127,347.836 L523.127,351.836 L543.127,355.836 L543.127,366.248 A0,0 0 0 0 543.127,366.248 L953.412,366.248 A0,0 0 0 0 953.412,366.248 L953.412,347.424 L943.412,337.424 L543.127,337.424 A0,0 0 0 0 543.127,337.424" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M943.412,337.424 L943.412,347.424 L953.412,347.424 L943.412,337.424" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="549.127" y="357.504" fill="#000" font-size="13" textLength="389.285" font-family="'Noto Sans CJK JP'">ここから先は2回目の呼び出し。POST /account-recovery/confirm</text><rect x="335.126" y="333.148" width="188.001" height="37.376" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="345.126" y="357.068" fill="#000" font-size="12" textLength="168.001" font-family="'Noto Sans CJK JP'">利用者がメールのリンクを開く</text><rect x="278.773" y="390.524" width="300.706" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="288.773" y="414.444" fill="#000" font-size="12" textLength="132.001" font-family="'Noto Sans CJK JP'">確認リンクトークン検証</text><text x="288.773" y="431.82" fill="#000" font-size="12" textLength="280.706" font-family="'Noto Sans CJK JP'">届いたトークンの SHA-256 ハッシュを保存値と照合</text><text x="288.773" y="449.196" fill="#000" font-size="12" textLength="103.261" font-family="'Noto Sans CJK JP'">confirmRecovery()</text><polygon points="307.522,490.248,550.731,490.248,562.731,506.176,550.731,522.104,307.522,522.104,295.522,506.176,307.522,490.248" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="307.522" y="503.008" fill="#000" font-size="11" textLength="243.208" font-family="'Noto Sans CJK JP'">ハッシュが保存値と合い、発行から15分以内で、</text><text x="307.522" y="518.936" fill="#000" font-size="11" textLength="241.998" font-family="'Noto Sans CJK JP'">未使用かつ新しい依頼で無効になっていない場合</text><text x="240.523" y="503.008" fill="#000" font-size="11" textLength="55" font-family="'Noto Sans CJK JP'">有効な場合</text><text x="562.731" y="487.08" fill="#000" font-size="11" textLength="276.208" font-family="'Noto Sans CJK JP'">トークンが無い、ハッシュが合わない、15分を超えた、</text><text x="562.731" y="503.008" fill="#000" font-size="11" textLength="241.998" font-family="'Noto Sans CJK JP'">使用済み、または新しい依頼で無効になった場合</text><path d="M260.002,545.068 L260.002,555.48 L240.002,559.48 L260.002,563.48 L260.002,573.892 A0,0 0 0 0 260.002,573.892 L502.002,573.892 A0,0 0 0 0 502.002,573.892 L502.002,555.068 L492.002,545.068 L260.002,545.068 A0,0 0 0 0 260.002,545.068" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M492.002,545.068 L492.002,555.068 L502.002,555.068 L492.002,545.068" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="266.002" y="565.148" fill="#000" font-size="13" textLength="221" font-family="'Noto Sans CJK JP'">削除：その利用者のセッションすべて</text><rect x="16" y="532.104" width="224.002" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="556.024" fill="#000" font-size="12" textLength="204.002" font-family="'Noto Sans CJK JP'">今までのセッションを無効にする処理</text><text x="26" y="573.4" fill="#000" font-size="12" textLength="108.865" font-family="'Noto Sans CJK JP'">revokeAllSessions()</text><path d="M254.002,619.82 L254.002,630.232 L234.002,634.232 L254.002,638.232 L254.002,648.644 A0,0 0 0 0 254.002,648.644 L483.002,648.644 A0,0 0 0 0 483.002,648.644 L483.002,629.82 L473.002,619.82 L254.002,619.82 A0,0 0 0 0 254.002,619.82" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M473.002,619.82 L473.002,629.82 L483.002,629.82 L473.002,619.82" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="260.002" y="639.9" fill="#000" font-size="13" textLength="208" font-family="'Noto Sans CJK JP'">削除：その利用者のパスキーすべて</text><rect x="22" y="606.856" width="212.001" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="32" y="630.776" fill="#000" font-size="12" textLength="192.001" font-family="'Noto Sans CJK JP'">今までのパスキーを無効にする処理</text><text x="32" y="648.153" fill="#000" font-size="12" textLength="111.049" font-family="'Noto Sans CJK JP'">revokeAllPasskeys()</text><path d="M218.001,694.573 L218.001,704.985 L198.001,708.985 L218.001,712.985 L218.001,723.397 A0,0 0 0 0 218.001,723.397 L643.432,723.397 A0,0 0 0 0 643.432,723.397 L643.432,704.573 L633.432,694.573 L218.001,694.573 A0,0 0 0 0 218.001,694.573" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M633.432,694.573 L633.432,704.573 L643.432,704.573 L633.432,694.573" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="224.001" y="714.653" fill="#000" font-size="13" textLength="404.43" font-family="'Noto Sans CJK JP'">保存：新しいセッション（例：24時間有効）と、トークンの使用済み</text><rect x="58" y="681.609" width="140.001" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="68" y="705.529" fill="#000" font-size="12" textLength="120.001" font-family="'Noto Sans CJK JP'">セッションを作る処理</text><text x="68" y="722.905" fill="#000" font-size="12" textLength="86.389" font-family="'Noto Sans CJK JP'">createSession()</text><path d="M244.065,760.637 L244.065,771.049 L224.065,775.049 L244.065,779.049 L244.065,789.461 A0,0 0 0 0 244.065,789.461 L538.066,789.461 A0,0 0 0 0 538.066,789.461 L538.066,770.637 L528.066,760.637 L244.065,760.637 A0,0 0 0 0 244.065,760.637" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M528.066,760.637 L528.066,770.637 L538.066,770.637 L528.066,760.637" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="250.065" y="780.717" fill="#000" font-size="13" textLength="273" font-family="'Noto Sans CJK JP'">このあと、新しい端末でパスキーを登録し直す</text><rect x="31.936" y="756.361" width="192.129" height="37.376" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="41.936" y="780.281" fill="#000" font-size="12" textLength="172.129" font-family="'Noto Sans CJK JP'">200 Cookie でセッションを返す</text><path d="M817.072,535.656 L817.072,555.48 L797.072,559.48 L817.072,563.48 L817.072,583.304 A0,0 0 0 0 817.072,583.304 L1085.073,583.304 A0,0 0 0 0 1085.073,583.304 L1085.073,545.656 L1075.073,535.656 L817.072,535.656 A0,0 0 0 0 817.072,535.656" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M1075.073,535.656 L1075.073,545.656 L1085.073,545.656 L1075.073,535.656" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="823.072" y="555.736" fill="#000" font-size="13" textLength="130" font-family="'Noto Sans CJK JP'">保存も削除もしない。</text><text x="823.072" y="574.56" fill="#000" font-size="13" textLength="247" font-family="'Noto Sans CJK JP'">今までのセッションとパスキーは変えない</text><rect x="663.432" y="532.104" width="133.641" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="673.432" y="556.024" fill="#000" font-size="12" textLength="60" font-family="'Noto Sans CJK JP'">失敗を返す</text><text x="673.432" y="573.4" fill="#000" font-size="12" textLength="113.641" font-family="'Noto Sans CJK JP'">400 INVALID_TOKEN</text><polygon points="429.126,799.737,441.126,811.737,429.126,823.737,417.126,811.737,429.126,799.737" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1309.046,250.228 L1309.046,270.052 L1289.046,274.052 L1309.046,278.052 L1309.046,297.876 A0,0 0 0 0 1309.046,297.876 L1718.135,297.876 A0,0 0 0 0 1718.135,297.876 L1718.135,260.228 L1708.135,250.228 L1309.046,250.228 A0,0 0 0 0 1309.046,250.228" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M1708.135,250.228 L1708.135,260.228 L1718.135,260.228 L1708.135,250.228" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="1315.046" y="270.308" fill="#000" font-size="13" textLength="247" font-family="'Noto Sans CJK JP'">保存しない。この依頼は回数に数えない。</text><text x="1315.046" y="289.132" fill="#000" font-size="13" textLength="388.089" font-family="'Noto Sans CJK JP'">Retry-After に、次に依頼できるまでの秒数（最長1時間）を入れる</text><rect x="1115.073" y="246.676" width="173.973" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1125.073" y="270.596" fill="#000" font-size="12" textLength="60" font-family="'Noto Sans CJK JP'">失敗を返す</text><text x="1125.073" y="287.972" fill="#000" font-size="12" textLength="153.973" font-family="'Noto Sans CJK JP'">429 TOO_MANY_REQUESTS</text><polygon points="815.593,829.737,827.593,841.737,815.593,853.737,803.593,841.737,815.593,829.737" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><ellipse cx="815.593" cy="884.737" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="815.593" cy="884.737" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="815.593" y1="80.684" x2="815.593" y2="105.096" style="stroke:#181818;stroke-width:1;"/><polygon points="811.593,95.096,815.593,105.096,819.593,95.096,815.593,99.096" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="429.126" y1="307.288" x2="429.126" y2="333.148" style="stroke:#181818;stroke-width:1;"/><polygon points="425.126,323.148,429.126,333.148,433.126,323.148,429.126,327.148" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="429.126" y1="370.524" x2="429.126" y2="390.524" style="stroke:#181818;stroke-width:1;"/><polygon points="425.126,380.524,429.126,390.524,433.126,380.524,429.126,384.524" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="128.001" y1="586.856" x2="128.001" y2="606.856" style="stroke:#181818;stroke-width:1;"/><polygon points="124.001,596.856,128.001,606.856,132.001,596.856,128.001,600.856" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="128.001" y1="661.609" x2="128.001" y2="681.609" style="stroke:#181818;stroke-