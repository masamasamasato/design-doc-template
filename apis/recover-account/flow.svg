<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1510px;height:904px;background:#FFFFFF;" width="1510px" height="904px" viewBox="0 0 1510 904" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="7"><text x="684.395" y="36.24" fill="#000" font-size="14" textLength="139.999" font-weight="700" font-family="'Noto Sans CJK JP'">アカウントを復旧する</text></g><path d="M705.079,56.272 L705.079,66.684 L685.079,70.684 L705.079,74.684 L705.079,85.096 A0,0 0 0 0 705.079,85.096 L984.948,85.096 A0,0 0 0 0 984.948,85.096 L984.948,66.272 L974.948,56.272 L705.079,56.272 A0,0 0 0 0 705.079,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M974.948,56.272 L974.948,66.272 L984.948,66.272 L974.948,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="711.079" y="76.352" fill="#000" font-size="13" textLength="258.869" font-family="'Noto Sans CJK JP'">1回目の呼び出し。POST /account-recovery</text><ellipse cx="675.079" cy="70.684" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="557.078" y="105.096" width="236.002" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="567.078" y="129.016" fill="#000" font-size="12" textLength="216.002" font-family="'Noto Sans CJK JP'">依頼回数の上限検証と確認リンクの発行</text><text x="567.078" y="146.392" fill="#000" font-size="12" textLength="162.661" font-family="'Noto Sans CJK JP'">過去1時間の回数を上限と照合</text><text x="567.078" y="163.768" fill="#000" font-size="12" textLength="102.397" font-family="'Noto Sans CJK JP'">requestRecovery()</text><polygon points="553.474,197.224,796.683,197.224,808.683,213.152,796.683,229.08,553.474,229.08,541.474,213.152,553.474,197.224" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="553.474" y="209.984" fill="#000" font-size="11" textLength="243.208" font-family="'Noto Sans CJK JP'">過去1時間で、同じメールアドレス宛が3回以内、</text><text x="553.474" y="225.912" fill="#000" font-size="11" textLength="143.395" font-family="'Noto Sans CJK JP'">かつ同じIPが10回以内の場合</text><text x="475.475" y="209.984" fill="#000" font-size="11" textLength="66" font-family="'Noto Sans CJK JP'">上限内の場合</text><text x="808.683" y="209.984" fill="#000" font-size="11" textLength="87.999" font-family="'Noto Sans CJK JP'">上限を超えた場合</text><path d="M515.11,239.08 L515.11,268.316 L495.11,272.316 L515.11,276.316 L515.11,305.552 A0,0 0 0 0 515.11,305.552 L884.94,305.552 A0,0 0 0 0 884.94,305.552 L884.94,249.08 L874.94,239.08 L515.11,239.08 A0,0 0 0 0 515.11,239.08" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M874.94,239.08 L874.94,249.08 L884.94,249.08 L874.94,239.08" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="521.11" y="259.16" fill="#000" font-size="13" textLength="348.829" font-family="'Noto Sans CJK JP'">1回限り。期限は15分。SHA-256 のハッシュだけ保存する。</text><text x="521.11" y="277.984" fill="#000" font-size="13" textLength="182" font-family="'Noto Sans CJK JP'">前のトークンは使えなくする。</text><text x="521.11" y="296.808" fill="#000" font-size="13" textLength="234" font-family="'Noto Sans CJK JP'">未登録のメールアドレスでも応答は同じ</text><rect x="235.108" y="253.628" width="260.002" height="37.376" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="245.108" y="277.548" fill="#000" font-size="12" textLength="240.002" font-family="'Noto Sans CJK JP'">確認リンクを登録したメールアドレスへ送る</text><path d="M479.11,329.828 L479.11,340.24 L459.11,344.24 L479.11,348.24 L479.11,358.652 A0,0 0 0 0 479.11,358.652 L889.395,358.652 A0,0 0 0 0 889.395,358.652 L889.395,339.828 L879.395,329.828 L479.11,329.828 A0,0 0 0 0 479.11,329.828" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M879.395,329.828 L879.395,339.828 L889.395,339.828 L879.395,329.828" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="485.11" y="349.908" fill="#000" font-size="13" textLength="389.285" font-family="'Noto Sans CJK JP'">ここから先は2回目の呼び出し。POST /account-recovery/confirm</text><rect x="271.109" y="325.552" width="188.001" height="37.376" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="281.109" y="349.472" fill="#000" font-size="12" textLength="168.001" font-family="'Noto Sans CJK JP'">利用者がメールのリンクを開く</text><rect x="214.756" y="382.928" width="300.706" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="224.756" y="406.848" fill="#000" font-size="12" textLength="132.001" font-family="'Noto Sans CJK JP'">確認リンクトークン検証</text><text x="224.756" y="424.224" fill="#000" font-size="12" textLength="280.706" font-family="'Noto Sans CJK JP'">届いたトークンの SHA-256 ハッシュを保存値と照合</text><text x="224.756" y="441.601" fill="#000" font-size="12" textLength="103.261" font-family="'Noto Sans CJK JP'">confirmRecovery()</text><polygon points="238.005,486.58,492.213,486.58,504.213,498.58,492.213,510.58,238.005,510.58,226.005,498.58,238.005,486.58" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="238.005" y="503.376" fill="#000" font-size="11" textLength="254.208" font-family="'Noto Sans CJK JP'">ハッシュが合い、発行から15分以内で未使用の場合</text><text x="171.006" y="495.412" fill="#000" font-size="11" textLength="55" font-family="'Noto Sans CJK JP'">有効な場合</text><text x="504.213" y="479.484" fill="#000" font-size="11" textLength="188.209" font-family="'Noto Sans CJK JP'">ハッシュが合わない、15分を超えた、</text><text x="504.213" y="495.412" fill="#000" font-size="11" textLength="109.999" font-family="'Noto Sans CJK JP'">または使用済みの場合</text><rect x="16" y="520.58" width="224.002" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="544.5" fill="#000" font-size="12" textLength="204.002" font-family="'Noto Sans CJK JP'">今までのセッションを無効にする処理</text><text x="26" y="561.877" fill="#000" font-size="12" textLength="108.865" font-family="'Noto Sans CJK JP'">revokeAllSessions()</text><path d="M254.002,608.297 L254.002,618.709 L234.002,622.709 L254.002,626.709 L254.002,637.121 A0,0 0 0 0 254.002,637.121 L496.002,637.121 A0,0 0 0 0 496.002,637.121 L496.002,618.297 L486.002,608.297 L254.002,608.297 A0,0 0 0 0 254.002,608.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M486.002,608.297 L486.002,618.297 L496.002,618.297 L486.002,608.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="260.002" y="628.377" fill="#000" font-size="13" textLength="221" font-family="'Noto Sans CJK JP'">なくした端末でログインできなくする</text><rect x="22" y="595.333" width="212.001" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="32" y="619.253" fill="#000" font-size="12" textLength="192.001" font-family="'Noto Sans CJK JP'">今までのパスキーを無効にする処理</text><text x="32" y="636.629" fill="#000" font-size="12" textLength="111.049" font-family="'Noto Sans CJK JP'">revokeAllPasskeys()</text><rect x="58" y="670.085" width="140.001" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="68" y="694.005" fill="#000" font-size="12" textLength="120.001" font-family="'Noto Sans CJK JP'">セッションを作る処理</text><text x="68" y="711.381" fill="#000" font-size="12" textLength="86.389" font-family="'Noto Sans CJK JP'">createSession()</text><path d="M232.731,749.113 L232.731,759.525 L212.731,763.525 L232.731,767.525 L232.731,777.937 A0,0 0 0 0 232.731,777.937 L526.732,777.937 A0,0 0 0 0 526.732,777.937 L526.732,759.113 L516.732,749.113 L232.731,749.113 A0,0 0 0 0 232.731,749.113" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M516.732,749.113 L516.732,759.113 L526.732,759.113 L516.732,749.113" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="238.731" y="769.193" fill="#000" font-size="13" textLength="273" font-family="'Noto Sans CJK JP'">このあと、新しい端末でパスキーを登録し直す</text><rect x="43.27" y="744.837" width="169.461" height="37.376" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="53.27" y="768.757" fill="#000" font-size="12" textLength="149.461" font-family="'Noto Sans CJK JP'">Cookie でセッションを返す</text><rect x="546.732" y="520.58" width="110.973" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="556.732" y="544.5" fill="#000" font-size="12" textLength="60" font-family="'Noto Sans CJK JP'">失敗を返す</text><text x="556.732" y="561.877" fill="#000" font-size="12" textLength="90.973" font-family="'Noto Sans CJK JP'">INVALID_TOKEN</text><polygon points="365.109,788.213,377.109,800.213,365.109,812.213,353.109,800.213,365.109,788.213" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1080.7,252.044 L1080.7,262.456 L1060.7,266.456 L1080.7,270.456 L1080.7,280.868 A0,0 0 0 0 1080.7,280.868 L1489.79,280.868 A0,0 0 0 0 1489.79,280.868 L1489.79,262.044 L1479.79,252.044 L1080.7,252.044 A0,0 0 0 0 1080.7,252.044" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1479.79,252.044 L1479.79,262.044 L1489.79,262.044 L1479.79,252.044" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1086.7" y="272.124" fill="#000" font-size="13" textLength="388.089" font-family="'Noto Sans CJK JP'">Retry-After に、次に依頼できるまでの秒数（最長1時間）を入れる</text><rect x="909.395" y="239.08" width="151.305" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="919.395" y="263" fill="#000" font-size="12" textLength="60" font-family="'Noto Sans CJK JP'">失敗を返す</text><text x="919.395" y="280.376" fill="#000" font-size="12" textLength="131.305" font-family="'Noto Sans CJK JP'">TOO_MANY_REQUESTS</text><polygon points="675.079,818.213,687.079,830.213,675.079,842.213,663.079,830.213,675.079,818