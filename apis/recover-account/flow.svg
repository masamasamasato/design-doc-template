.001" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="293.109" y="367.521" fill="#000" font-size="12" textLength="144.001" font-family="'Noto Sans CJK JP'">確認リンクを確かめる処理</text><text x="293.109" y="384.897" fill="#000" font-size="12" textLength="103.261" font-family="'Noto Sans CJK JP'">confirmRecovery()</text><polygon points="230.503,418.353,499.715,418.353,511.715,430.353,499.715,442.353,230.503,442.353,218.503,430.353,230.503,418.353" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="230.503" y="435.149" fill="#000" font-size="11" textLength="269.212" font-family="'Noto Sans CJK JP'">トークンのハッシュが保存値と合い、期限内で未使用?</text><text x="196.503" y="427.185" fill="#000" font-size="11" textLength="22" font-family="'Noto Sans CJK JP'">はい</text><text x="511.715" y="427.185" fill="#000" font-size="11" textLength="33" font-family="'Noto Sans CJK JP'">いいえ</text><rect x="16" y="452.353" width="224.002" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="476.273" fill="#000" font-size="12" textLength="204.002" font-family="'Noto Sans CJK JP'">今までのセッションを無効にする処理</text><text x="26" y="493.649" fill="#000" font-size="12" textLength="108.865" font-family="'Noto Sans CJK JP'">revokeAllSessions()</text><path d="M254.002,540.069 L254.002,550.481 L234.002,554.481 L254.002,558.481 L254.002,568.893 A0,0 0 0 0 254.002,568.893 L496.002,568.893 A0,0 0 0 0 496.002,568.893 L496.002,550.069 L486.002,540.069 L254.002,540.069 A0,0 0 0 0 254.002,540.069" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M486.002,540.069 L486.002,550.069 L496.002,550.069 L486.002,540.069" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="260.002" y="560.149" fill="#000" font-size="13" textLength="221" font-family="'Noto Sans CJK JP'">なくした端末でログインできなくする</text><rect x="22" y="527.105" width="212.001" height="54.752" fill="#F1F1F