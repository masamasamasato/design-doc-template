_SAVE_FAILED</text><text x="72" y="558.224" fill="#000" font-size="13" textLength="247" font-family="'Noto Sans CJK JP'">何も保存しない。決済サービスが再送する</text></g><line x1="39" y1="572.968" x2="825.048" y2="572.968" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="44" y="587.727" fill="#000" font-size="11" textLength="184.799" font-weight="700" font-family="'Noto Sans CJK JP'">[新しいイベントIDを保存できた場合]</text><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg7" data-source-line="23"><polygon points="66,633.543,56,637.543,66,641.543,62,637.543" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="60" y1="637.543" x2="325" y2="637.543" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="72" y="612.975" fill="#000" font-size="13" textLength="193.31" font-family="'Noto Sans CJK JP'">200 通知とイベントIDを保存した</text><text x="72" y="631.799" fill="#000" font-size="13" textLength="117" font-family="'Noto Sans CJK JP'">反映を待たずに返す</text></g><path d="M331,650.543 L331,697.543 L560,697.543 L560,660.543 L550,650.543 L331,650.543" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M550,650.543 L550,660.543 L560,660.543 L550,650.543" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="337" y="670.623" fill="#000" font-size="13" textLength="208" font-family="'Noto Sans CJK JP'">ここから先は、返事のあとで行う。</text><text x="337" y="689.448" fill="#000" font-size="13" textLength="188.968" font-family="'Noto Sans CJK JP'">同じイベントIDの反映は1回だけ</text><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg8" data-source-line="25"><line x1="326" y1="746.84" x2="368" y2="746.84" style="stroke:#181818;stroke-width:1;"/><line x1="368" y1="746.84" x2="368" y2="759.84" style="stroke:#181818;stroke-width:1;"/><line x1="327" y1="759.84" x2="368" y2="759.84" style="stroke:#181818;stroke-width:1;"/><polygon points="337,755.84,327,759.84,337,763.84,333,759.84" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="333" y="722.272" fill="#000" font-size="13" textLength="156" font-family="'Noto Sans CJK JP'">保存した通知を反映に回す</text><text x="333" y="741.096" fill="#000" font-size="13" textLength="187.811" font-family="'Noto Sans CJK JP'">processSavedPaymentEvents()</text></g><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg9" data-source-line="26"><line x1="326" y1="811.488" x2="368" y2="811.488" style="stroke:#181818;stroke-width:1;"/><line x1="368" y1="811.488" x2="368" y2="824.488" style="stroke:#181818;stroke-width:1;"/><line x1="327" y1="824.488" x2="368" y2="824.488" style="stroke:#181818;stroke-width:1;"/><polygon points="337,820.488,327,824.488,337,828.488,333,824.488" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="333" y="786.92" fill="#000" font-size="13" textLength="78" font-family="'Noto Sans CJK JP'">注文照合検証</text><text x="333" y="805.744" fill="#000" font-size="13" textLength="82.563" font-family="'Noto Sans CJK JP'">matchOrder()</text></g><path d="M291,836.488 L353.251,836.488 L353.251,847.312 L343.251,857.312 L291,857.312 L291,836.488" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="291" y="836.488" width="509.048" height="452.88" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="306" y="852.568" fill="#000" font-size="13" textLength="17.251" font-weight="700" font-family="'Noto Sans CJK JP'">alt</text><text x="368.251" y="851.247" fill="#000" font-size="11" textLength="415.797" font-weight="700" font-family="'Noto Sans CJK JP'">[通知の注文IDの注文が無い、または金額・通貨のどれかが保存した注文と違う場合]</text><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg10" data-source-line="28"><line x1="326" y1="893.063" x2="368" y2="893.063" style="stroke:#181818;stroke-width:1;"/><line x1="368" y1="893.063" x2="368" y2="906.063" style="stroke:#181818;stroke-width:1;"/><line x1="327" y1="906.063" x2="368" y2="906.063" style="stroke:#181818;stroke-width:1;"/><polygon points="337,902.063,327,906.063,337,910.063,333,906.063" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="333" y="887.319" fill="#000" font-size="13" textLength="325" font-family="'Noto Sans CJK JP'">注文は変えず、通知の中身を記録し、運用者へ警告する</text></g><line x1="291" y1="915.063" x2="800.048" y2="915.063" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="296" y="929.823" fill="#000" font-size="11" textLength="217.314" font-weight="700" font-family="'Noto Sans CJK JP'">[注文があり、金額・通貨がすべて同じ場合]</text><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg11" data-source-line="30"><line x1="326" y1="960.815" x2="368" y2="960.815" style="stroke:#181818;stroke-width:1;"/><line x1="368" y1="960.815" x2="368" y2="973.815" style="stroke:#181818;stroke-width:1;"/><line x1="327" y1="973.815" x2="368" y2="973.815" style="stroke:#181818;stroke-width:1;"/><polygon points="337,969.815,327,973.815,337,977.815,333,973.815" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="333" y="955.071" fill="#000" font-size="13" textLength="131.547" font-family="'Noto Sans CJK JP'">applyPaymentEvent()</text></g><path d="M310,985.815 L372.251,985.815 L372.251,996.639 L362.251,1006.639 L310,1006.639 L310,985.815" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="310" y="985.815" width="351" height="289.552" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="325" y="1001.895" fill="#000" font-size="13" textLength="17.251" font-weight="700" font-family="'Noto Sans CJK JP'">alt</text><text x="387.251" y="1000.575" fill="#000" font-size="11" textLength="195.799" font-weight="700" font-family="'Noto Sans CJK JP'">[同じイベントIDを既に反映済みの場合]</text><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg12" data-source-line="32"><line x1="326" y1="1042.391" x2="368" y2="1042.391" style="stroke:#181818;stroke-