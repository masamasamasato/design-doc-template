0.895" style="stroke:#181818;stroke-width:1;"/><polygon points="337,1186.895,327,1190.895,337,1194.895,333,1190.895" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="333" y="1172.151" fill="#000" font-size="13" textLength="312" font-family="'Noto Sans CJK JP'">通知のとおり、支払い済みまたは失敗にして保存する</text></g><path d="M331,1203.895 L331,1269.895 L560,1269.895 L560,1213.895 L550,1203.895 L331,1203.895" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M550,1203.895 L550,1213.895 L560,1213.895 L550,1203.895" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="337" y="1223.975" fill="#000" font-size="13" textLength="208" font-family="'Noto Sans CJK JP'">失敗から支払い済みへ進めるのは、</text><text x="337" y="1242.799" fill="#000" font-size="13" textLength="182" font-family="'Noto Sans CJK JP'">支払い済みの通知のときだけ。</text><text x="337" y="1261.623" fill="#000" font-size="13" textLength="208" font-family="'Noto Sans CJK JP'">失敗に失敗の通知なら、失敗のまま</text></g></svg>