ke-width:1.5;"/><text x="54" y="393.424" fill="#000" font-size="13" textLength="17.251" font-weight="700" font-family="'Noto Sans CJK JP'">alt</text><text x="116.251" y="392.104" fill="#000" font-size="11" textLength="284.282" font-weight="700" font-family="'Noto Sans CJK JP'">[通知のイベントIDが、保存済みのイベントIDと合う場合]</text><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg5" data-source-line="19"><polygon points="66,448.744,56,452.744,66,456.744,62,452.744" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="60" y1="452.744" x2="325" y2="452.744" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="72" y="428.176" fill="#000" font-size="13" textLength="21.645" font-family="'Noto Sans CJK JP'">200</text><text x="72" y="447" fill="#000" font-size="13" textLength="104" font-family="'Noto Sans CJK JP'">重ねて保存しない</text></g><line x1="39" y1="461.744" x2="871.042" y2="461.744" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="44" y="476.504" fill="#000" font-size="11" textLength="443.275" font-weight="700" font-family="'Noto Sans CJK JP'">[通知のイベントIDが保存済みのイベントIDと合わない かつ 通知を保存できなかった場合]</text><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg6" data-source-line="21"><polygon points="66,522.32,56,526.32,66,530.32,62,526.32" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="60" y1="526.32" x2="325" y2="526.32" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="72" y="501.752" fill="#000" font-size="13" textLength="152.399" font-family="'Noto Sans CJK JP'">500 EVENT_SAVE_FAILED</text><text x="72" y="520.576" fill="#000" font-size="13" textLength="247" font-family="'Noto Sans CJK JP'">何も保存しない。決済サービスが再送する</text></g><line x1="39" y1="535.32" x2="871.042" y2="535.32" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="44" y="550.079" fill="#000" font-size="11" textLength="432.275" font-weight="700" font-family="'Noto Sans CJK JP'">[通知のイベントIDが保存済みのイベントIDと合わない かつ 通知の保存が終わった場合]</text><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg7" data-source-line="23"><polygon points="66,595.895,56,599.895,66,603.895,62,599.895" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="60" y1="599.895" x2="325" y2="599.895" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="72" y="575.327" fill="#000" font-size="13" textLength="193.31" font-family="'Noto Sans CJK JP'">200 通知とイベントIDを保存した</text><text x="72" y="594.151" fill="#000" font-size="13" textLength="117" font-family="'Noto Sans CJK JP'">反映を待たずに返す</text></g><path d="M331,612.895 L331,659.895 L560,659.895 L560,622.895 L550,612.895 L331,612.895" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M550,612.895 L550,622.895 L560,622.895 L550,612.895" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="337" y="632.975" fill="#000" font-size="13" textLength="208" font-family="'Noto Sans CJK JP'">ここから先は、応答のあとで行う。</text><text x="337" y="651.799" fill="#000" font-size="13" textLength="188.968" font-family="'Noto Sans CJK JP'">同じイベントIDの反映は1回だけ</text><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg8" data-source-line="25"><line x1="326" y1="709.192" x2="368" y2="709.192" style="stroke:#181818;stroke-width:1;"/><line x1="368" y1="709.192" x2="368" y2="722.192" style="stroke:#181818;stroke-width:1;"/><line x1="327" y1="722.192" x2="368" y2="722.192" style="stroke:#181818;stroke-width:1;"/><polygon points="337,718.192,327,722.192,337,726.192,333,722.192" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="333" y="684.623" fill="#000" font-size="13" textLength="78.741" font-family="'Noto Sans CJK JP'">3. 反映に回す</text><text x="333" y="703.448" fill="#000" font-size="13" textLength="91.741" font-family="'Noto Sans CJK JP'">4. 注文照合検証</text></g><path d="M310,734.192 L372.251,734.192 L372.251,745.016 L362.251,755.016 L310,755.016 L310,734.192" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="310" y="734.192" width="536.042" height="221.8" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="325" y="750.272" fill="#000" font-size="13" textLength="17.251" font-weight="700" font-family="'Noto Sans CJK JP'">alt</text><text x="387.251" y="748.951" fill="#000" font-size="11" textLength="442.791" font-weight="700" font-family="'Noto Sans CJK JP'">[通知の注文IDの注文が無い または 金額・通貨のいずれかが保存した注文と合わない場合]</text><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg9" data-source-line="27"><line x1="326" y1="790.767" x2="368" y2="790.767" style="stroke:#181818;stroke-width:1;"/><line x1="368" y1="790.767" x2="368" y2="803.767" style="stroke:#181818;stroke-width:1;"/><line x1="327" y1="803.767" x2="368" y2="803.767" style="stroke:#181818;stroke-width:1;"/><polygon points="337,799.767,327,803.767,337,807.767,333,803.767" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="333" y="785.023" fill="#000" font-size="13" textLength="325" font-family="'Noto Sans CJK JP'">注文は変えず、通知の中身を記録し、運用者へ警告する</text></g><line x1="310" y1="812.767" x2="846.042" y2="812.767" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="315" y="827.527" fill="#000" font-size="11" textLength="354.792" font-weight="700" font-family="'Noto Sans CJK JP'">[通知の注文IDの注文がある かつ 金額・通貨が保存した注文と合う場合]</text><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg10" data-source-line="29"><line x1="326" y1="877.343" x2="368" y2="877.343" style="stroke:#181818;stroke-width:1;"/><line x1="368" y1="877.343" x2="368" y2="890.343" style="stroke:#181818;stroke-width:1;"/><line x1="327" y1="890.343" x2="368" y2="890.343" style="stroke:#181818;stroke-width:1;"/><polygon points="337,886.343,327,890.343,337,894.343,333,890.343" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="333" y="852.775" fill="#000" font-size="13" textLength="117.741" font-family="'Noto Sans CJK JP'">5. 決済の結果の反映</text><text x="333" y="871.599" fill="#000" font-size="13" textLength="130" font-family="'Noto Sans CJK JP'">状態を一方向に進める</text></g><path d="M331,903.343 L331,950.343 L469,950.343 L469,913.343 L459,903.343 L331,903.343" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M459,903.343 L459,913.343 L469,913.343 L459,903.343" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="337" y="923.423" fill="#000" font-size="13" textLength="117" font-family="'Noto Sans CJK JP'">途中で失敗したら、</text><text x="337" y="942.247" fill="#000" font-size="13" textLength="104.741" font-family="'Noto Sans CJK JP'">6. 反映のやり直し</text></g></svg>