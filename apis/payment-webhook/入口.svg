:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="333" y="722.272" fill="#000" font-size="13" textLength="156" font-family="'Noto Sans CJK JP'">保存した通知を反映に回す</text><text x="333" y="741.096" fill="#000" font-size="13" textLength="187.811" font-family="'Noto Sans CJK JP'">processSavedPaymentEvents()</text></g><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg9" data-source-line="26"><line x1="326" y1="811.488" x2="368" y2="811.488" style="stroke:#181818;stroke-width:1;"/><line x1="368" y1="811.488" x2="368" y2="824.488" style="stroke:#181818;stroke-width:1;"/><line x1="327" y1="824.488" x2="368" y2="824.488" style="stroke:#181818;stroke-width:1;"/><polygon points="337,820.488,327,824.488,337,828.488,333,824.488" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="333" y="786.92" fill="#000" font-size="13" textLength="78" font-family="'Noto Sans CJK JP'">注文照合検証</text><text x="333" y="805.744" fill="#000" font-size="13" textLength="82.563" font-family="'Noto Sans CJK JP'">matchOrder()</text></g><path d="M291,836.488 L353.251,836.488 L353.251,847.312 L343.251,857.312 L291,857.312 L291,836.488" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="291" y="836.488" width="589.753" height="595.928" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="306" y="852.568" fill="#000" font-size="13" textLength="17.251" font-weight="700" font-family="'Noto Sans CJK JP'">alt</text><text x="368.251" y="851.247" fill="#000" font-size="11" textLength="415.797" font-weight="700" font-family="'Noto Sans CJK JP'">[通知の注文IDの注文が無い、または金額・通貨のどれかが保存した注文と違う場合]</text><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg10" data-source-line="28"><line x1="326" y1="911.888" x2="368" y2="911.888" style="stroke:#181818;stroke-width:1;"/><line x1="368" y1="911.888" x2="368" y2="924.888" style="stroke:#181818;stroke-width:1;"/><line x1="327" y1="924.888" x2="368" y2="924.888" style="stroke:#181818;stroke-width:1;"/><polygon points="337,920.888,327,924.888,337,928.888,333,924.888" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="333" y="887.319" fill="#000" font-size="13" textLength="338" font-family="'Noto Sans CJK JP'">注文は変えず、通知の中身を記録し、運用者へ警告する。</text><text x="333" y="906.144" fill="#000" font-size="13" textLength="247" font-family="'Noto Sans CJK JP'">再送されても直らないので、やり直さない</text></g><line x1="291" y1="933.888" x2="880.753" y2="933.888" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="296" y="948.647" fill="#000" font-size="11" textLength="217.314" font-weight="700" font-family="'Noto Sans CJK JP'">[注文があり、金額・通貨がすべて同じ場合]</text><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg11" data-source-line="30"><line x1="326" y1="998.463" x2="368" y2="998.463" style="stroke:#181818;stroke-width:1;"/><line x1="368" y1="998.463" x2="368" y2="1011.463" style="stroke:#181818;stroke-width:1;"/><line x1="327" y1="1011.463" x2="368" y2="1011.463" style="stroke:#181818;stroke-width:1;"/><polygon points="337,1007.463,327,1011.463,337,1015.463,333,1011.463" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="333" y="973.895" fill="#000" font-size="13" textLength="104" font-family="'Noto Sans CJK JP'">決済の結果の反映</text><text x="333" y="992.719" fill="#000" font-size="13" textLength="131.547" font-family="'Noto Sans CJK JP'">applyPaymentEvent()</text></g><path d="M310,1023.463 L372.251,1023.463 L372.251,1034.287 L362.251,1044.287 L310,1044.287 L310,1023.463" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="310" y="1023.463" width="545.753" height="394.952" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="325" y="1039.543" fill="#000" font-size="13" textLength="17.251" font-weight="700" font-family="'Noto Sans CJK JP'">alt</text><text x="387.251" y="1038.223" fill="#000" font-size="11" textLength="195.799" font-weight="700" font-family="'Noto Sans CJK JP'">[同じイベントIDを既に反映済みの場合]</text><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg12" data-source-line="32"><line x1="326" y1="1080.039" x2="368" y2="1080.039" style="stroke:#181818;stroke-width:1;"/><line x1="368" y1="1080.039" x2="368" y2="1093.039" style="stroke:#181818;stroke-width:1;"/><line x1="327" y1="1093.039" x2="368" y2="1093.039" style="stroke:#181818;stroke-width:1;"/><polygon points="337,1089.039,327,1093.039,337,1097.039,333,1093.039" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="333" y="1074.295" fill="#000" font-size="13" textLength="65" font-family="'Noto Sans CJK JP'">何もしない</text></g><line x1="310" y1="1102.039" x2="855.753" y2="1102.039" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="315" y="1116.799" fill="#000" font-size="11" textLength="151.315" font-weight="700" font-family="'Noto Sans CJK JP'">[注文が既に支払い済みの場合]</text><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg13" data-source-line="34"><line x1="326" y1="1166.615" x2="368" y2="1166.615" style="stroke:#181818;stroke-width:1;"/><line x1="368" y1="1166.615" x2="368" y2="1179.615" style="stroke:#181818;stroke-width:1;"/><line x1="327" y1="1179.615" x2="368" y2="1179.615" style="stroke:#181818;stroke-width:1;"/><polygon points="337,1175.615,327,1179.615,337,1183.615,333,1179.615" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="333" y="1142.047" fill="#000" font-size="13" textLength="273" font-family="'Noto Sans CJK JP'">支払い済みのまま変えない。通知を記録する。</text><text x="333" y="1160.871" fill="#000" font-size="13" textLength="506.753" font-family="'Noto Sans CJK JP'">別のイベントIDの支払い済みの通知なら、運用者へ警告する（二重に請求された疑い）</text></g><line x1="310" y1="1188.615" x2="855.753" y2="1188.615" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="315" y="1203.375" fill="#000" font-size="11" textLength="107.315" font-weight="700" font-family="'Noto Sans CJK JP'">[注文が未払いの場合]</text><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg14" data-source-line="36"><line x1="326" y1="1253.191" x2="368" y2="1253.191" style="stroke:#181818;stroke-width:1;"/><line x1="368" y1="1253.191" x2="368" y2="1266.191" style="stroke:#181818;stroke-width:1;"/><line x1="327" y1="1266.191" x2="368" y2="1266.191" style="stroke:#181818;stroke-width:1;"/><polygon points="337,1262.191,327,1266.191,337,1270.191,333,1266.191" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="333" y="1228.623" fill="#000" font-size="13" textLength="403" font-family="'Noto Sans CJK JP'">支払い済みの通知なら支払い済みにして保存し、運用者へ警告する。</text><text x="333" y="1247.447" fill="#000" font-size="13" textLength="169" font-family="'Noto Sans CJK JP'">失敗の通知なら未払いのまま</text></g><line x1="310" y1="1275.191" x2="855.753" y2="1275.191" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="315" y="1289.951" fill="#000" font-size="11" textLength="173.315" font-weight="700" font-family="'Noto Sans CJK JP'">[注文が処理中、または失敗の場合]</text><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg15" data-source-line="38"><line x1="326" y1="1320.943" x2="368" y2="1320.943" style="stroke:#181818;stroke-width:1;"/><line x1="368" y1="1320.943" x2="368" y2="1333.943" style="stroke:#181818;stroke-width:1;"/><line x1="327" y1="1333.943" x2="368" y2="1333.943" style="stroke:#181818;stroke-width:1;"/><polygon points="337,1329.943,327,1333.943,337,1337.943,333,1333.943" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="333" y="1315.199" fill="#000" font-size="13" textLength="312" font-family="'Noto Sans CJK JP'">通知のとおり、支払い済みまたは失敗にして保存する</text></g><path d="M331,1346.943 L331,1412.943 L560,1412.943 L560,1356.943 L550,1346.943 L331,1346.943" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M550,1346.943 L550,1356.943 L560,1356.943 L550,1346.943" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="337" y="1367.023" fill="#000" font-size="13" textLength="208" font-family="'Noto Sans CJK JP'">失敗から支払い済みへ進めるのは、</text><text x="337" y="1385.847" fill="#000" font-size="13" textLength="182" font-family="'Noto Sans CJK JP'">支払い済みの通知のときだけ。</text><text x="337" y="1404.671" fill="#000" font-size="13" textLength="208" font-family="'Noto Sans CJK JP'">失敗に失敗の通知なら、失敗のまま</text></g></svg>