<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:953px;height:539px;background:#FFFFFF;" width="953px" height="539px" viewBox="0 0 953 539" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="7"><text x="426.515" y="36.24" fill="#000" font-size="14" textLength="98" font-weight="700" font-family="'Noto Sans CJK JP'">商品を検索する</text></g><path d="M614.669,56.272 L614.669,66.684 L594.669,70.684 L614.669,74.684 L614.669,85.096 A0,0 0 0 0 614.669,85.096 L804.669,85.096 A0,0 0 0 0 804.669,85.096 L804.669,66.272 L794.669,56.272 L614.669,56.272 A0,0 0 0 0 614.669,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M794.669,56.272 L794.669,66.272 L804.669,66.272 L794.669,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="620.669" y="76.352" fill="#000" font-size="13" textLength="169" font-family="'Noto Sans CJK JP'">検索する前にログインが必要</text><ellipse cx="584.669" cy="70.684" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="408.594" y="105.096" width="352.151" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="418.594" y="129.016" fill="#000" font-size="12" textLength="84.001" font-family="'Noto Sans CJK JP'">セッション検証</text><text x="418.594" y="146.392" fill="#000" font-size="12" textLength="332.151" font-family="'Noto Sans CJK JP'">リクエストの Cookie を、保存済みの有効なセッションと照合</text><text x="418.594" y="163.768" fill="#000" font-size="12" textLength="91.669" font-family="'Noto Sans CJK JP'">requireSession()</text><polygon points="498.435,208.748,670.903,208.748,682.903,220.748,670.903,232.748,498.435,232.748,486.435,220.748,498.435,208.748" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="498.435" y="225.544" fill="#000" font-size="11" textLength="172.468" font-family="'Noto Sans CJK JP'">セッションの Cookie が有効な場合</text><text x="431.436" y="217.58" fill="#000" font-size="11" textLength="55" font-family="'Noto Sans CJK JP'">有効な場合</text><text x="682.903" y="201.652" fill="#000" font-size="11" textLength="150.468" font-family="'Noto Sans CJK JP'">セッションの Cookie が無い、</text><text x="682.903" y="217.58" fill="#000" font-size="11" textLength="87.999" font-family="'Noto Sans CJK JP'">または無効な場合</text><rect x="150.207" y="242.748" width="284.002" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="160.207" y="266.668" fill="#000" font-size="12" textLength="264.002" font-family="'Noto Sans CJK JP'">商品名に検索語を含む、公開中の商品を返す処理</text><text x="160.207" y="284.044" fill="#000" font-size="12" textLength="95.701" font-family="'Noto Sans CJK JP'">searchProducts()</text><polygon points="125.999,329.024,458.417,329.024,470.417,341.024,458.417,353.024,125.999,353.024,113.999,341.024,125.999,329.024" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="125.999" y="345.82" fill="#000" font-size="11" textLength="332.418" font-family="'Noto Sans CJK JP'">検索語が1〜100文字で、ページ分けと並び順が決まりどおりの場合</text><text x="15" y="337.856" fill="#000" font-size="11" textLength="98.999" font-family="'Noto Sans CJK JP'">決まりどおりの場合</text><text x="470.417" y="321.928" fill="#000" font-size="11" textLength="194.314" font-family="'Noto Sans CJK JP'">検索語が無い・空・100文字超、または</text><text x="470.417" y="337.856" fill="#000" font-size="11" textLength="230.998" font-family="'Noto Sans CJK JP'">ページ分けや並び順が決まりどおりでない場合</text><path d="M176,367.3 L176,377.712 L156,381.712 L176,385.712 L176,396.124 A0,0 0 0 0 176,396.124 L373.215,396.124 A0,0 0 0 0 373.215,396.124 L373.215,377.3 L363.215,367.3 L176,367.3 A0,0 0 0 0 176,367.3" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M363.215,367.3 L363.215,377.3 L373.215,377.3 L363.215,367.3" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="182" y="387.38" fill="#000" font-size="13" textLength="176.215" font-family="'Noto Sans CJK JP'">0件でも成功。空の結果を返す</text><rect x="51.999" y="363.024" width="104.001" height="37.376" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="61.999" y="386.944" fill="#000" font-size="12" textLength="84.001" font-family="'Noto Sans CJK JP'">検索結果を返す</text><path d="M555.417,375.988 L555.417,386.4 L535.417,390.4 L555.417,394.4 L555.417,404.812 A0,0 0 0 0 555.417,404.812 L791.23,404.812 A0,0 0 0 0 791.23,404.812 L791.23,385.988 L781.23,375.988 L555.417,375.988 A0,0 0 0 0 555.417,375.988" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M781.23,375.988 L781.23,385.988 L791.23,385.988 L781.23,375.988" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="561.417" y="396.068" fill="#000" font-size="13" textLength="214.812" font-family="'Noto Sans CJK JP'">例: 検索語が空、101文字、limit=200</text><rect x="425.417" y="363.024" width="110.001" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="435.417" y="386.944" fill="#000" font-size="12" textLength="60" font-family="'Noto Sans CJK JP'">失敗を返す</text><text x="435.417" y="404.32" fill="#000" font-size="12" textLength="90.001" font-family="'Noto Sans CJK JP'">INVALID_QUERY</text><polygon points="292.208,423.776,304.208,435.776,292.208,447.776,280.208,435.776,292.208,423.776" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="821.23" y="242.748" width="111.801" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="831.23" y="266.668" fill="#000" font-size="12" textLength="60" font-family="'Noto Sans CJK JP'">失敗を返す</text><text x="831.23" y="284.044" fill="#000" font-size="12" textLength="91.801" font-family="'Noto Sans CJK JP'">UNAUTHORIZED</text><polygo