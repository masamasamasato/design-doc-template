<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1159px;height:561px;background:#FFFFFF;" width="1159px" height="561px" viewBox="0 0 1159 561" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="8"><text x="529.917" y="36.24" fill="#000" font-size="14" textLength="98" font-weight="700" font-family="'Noto Sans CJK JP'">商品を検索する</text></g><path d="M636.188,56.272 L636.188,66.684 L616.188,70.684 L636.188,74.684 L636.188,85.096 A0,0 0 0 0 636.188,85.096 L917.189,85.096 A0,0 0 0 0 917.189,85.096 L917.189,66.272 L907.189,56.272 L636.188,56.272 A0,0 0 0 0 636.188,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M907.189,56.272 L907.189,66.272 L917.189,66.272 L907.189,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="642.188" y="76.352" fill="#000" font-size="13" textLength="260" font-family="'Noto Sans CJK JP'">読むだけ。どの枝でも、保存も削除もしない</text><ellipse cx="606.188" cy="70.684" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="430.113" y="105.096" width="352.151" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="440.113" y="129.016" fill="#000" font-size="12" textLength="84.001" font-family="'Noto Sans CJK JP'">セッション検証</text><text x="440.113" y="146.392" fill="#000" font-size="12" textLength="332.151" font-family="'Noto Sans CJK JP'">リクエストの Cookie を、保存済みの有効なセッションと照合</text><text x="440.113" y="163.768" fill="#000" font-size="12" textLength="91.669" font-family="'Noto Sans CJK JP'">requireSession()</text><polygon points="519.954,208.748,692.422,208.748,704.422,220.748,692.422,232.748,519.954,232.748,507.954,220.748,519.954,208.748" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="519.954" y="225.544" fill="#000" font-size="11" textLength="172.468" font-family="'Noto Sans CJK JP'">セッションの Cookie が有効な場合</text><text x="452.955" y="217.58" fill="#000" font-size="11" textLength="55" font-family="'Noto Sans CJK JP'">有効な場合</text><text x="704.422" y="201.652" fill="#000" font-size="11" textLength="150.468" font-family="'Noto Sans CJK JP'">セッションの Cookie が無い、</text><text x="704.422" y="217.58" fill="#000" font-size="11" textLength="87.999" font-family="'Noto Sans CJK JP'">または無効な場合</text><rect x="127.37" y="242.748" width="342.814" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="137.37" y="266.668" fill="#000" font-size="12" textLength="108.001" font-family="'Noto Sans CJK JP'">検索語と指定の検証</text><text x="137.37" y="284.044" fill="#000" font-size="12" textLength="322.814" font-family="'Noto Sans CJK JP'">q の文字数と、page・limit・sort・order を、決まりと照合</text><text x="137.37" y="301.42" fill="#000" font-size="12" textLength="95.701" font-family="'Noto Sans CJK JP'">searchProducts()</text><polygon points="177.112,342.472,420.441,342.472,432.441,358.4,420.441,374.328,177.112,374.328,165.112,358.4,177.112,342.472" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="177.112" y="355.232" fill="#000" font-size="11" textLength="243.329" font-family="'Noto Sans CJK JP'">q が1〜100文字で、page・limit・sort・order が</text><text x="177.112" y="371.16" fill="#000" font-size="11" textLength="142.999" font-family="'Noto Sans CJK JP'">用語集の決まりどおりの場合</text><text x="66.113" y="355.232" fill="#000" font-size="11" textLength="98.999" font-family="'Noto Sans CJK JP'">決まりどおりの場合</text><text x="432.441" y="339.304" fill="#000" font-size="11" textLength="170.598" font-family="'Noto Sans CJK JP'">q が無い・空・100文字超、または</text><text x="432.441" y="355.232" fill="#000" font-size="11" textLength="308.625" font-family="'Noto Sans CJK JP'">page・limit・sort・order のどれかが決まりどおりでない場合</text><path d="M210.669,38