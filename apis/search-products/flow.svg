NAUTHORIZED</text><ellipse cx="206.566" cy="338.98" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="206.566" cy="338.98" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="89.202,187.444,323.929,187.444,335.929,203.372,323.929,219.3,89.202,219.3,77.202,203.372,89.202,187.444" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="210.566" y="232.06" fill="#000" font-size="11" textLength="83.731" font-family="'Noto Sans CJK JP'">1.2 セッションが</text><text x="210.566" y="247.988" fill="#000" font-size="11" textLength="66" font-family="'Noto Sans CJK JP'">合わない場合</text><text x="89.202" y="200.204" fill="#000" font-size="11" textLength="234.727" font-family="'Noto Sans CJK JP'">Cookie が無い または Cookie のセッションIDが</text><text x="89.202" y="216.132" fill="#000" font-size="11" textLength="219.998" font-family="'Noto Sans CJK JP'">保存済みの有効なセッションと合わない場合</text><text x="335.929" y="184.276" fill="#000" font-size="11" textLength="83.731" font-family="'Noto Sans CJK JP'">1.1 セッションが</text><text x="335.929" y="200.204" fill="#000" font-size="11" textLength="44" font-family="'Noto Sans CJK JP'">合う場合</text><rect x="78.503" y="391.98" width="256.126" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="88.503" y="415.9" fill="#000" font-size="12" textLength="156.685" font-family="'Noto Sans CJK JP'">2. リクエストバリデーション</text><text x="88.503" y="433.276" fill="#000" font-size="12" textLength="236.126" font-family="'Noto Sans CJK JP'">q・page・limit・sort・order を条件と照合</text><path d="M292.9,553.076 L292.9,563.488 L272.9,567.488 L292.9,571.488 L292.9,581.9 A0,0 0 0 0 292.9,581.9 L534.042,581.9 A0,0 0 0 0 534.042,581.9 L534.042,563.076 L524.042,553.076 L292.9,553.076 A0,0 0 0 0 292.9,553.076" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M524.042,553.076 L524.042,563.076 L534.042,563.076 L524.042,553.076" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="298.9" y="573.156" fill="#000" font-size="13" textLength="220.142" font-family="'Noto Sans CJK JP'">例： q が空、q が101文字、limit=200</text><rect x="140.231" y="540.112" width="132.669" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="150.231" y="564.032" fill="#000" font-size="12" textLength="60" font-family="'Noto Sans CJK JP'">失敗を返す</text><text x="150.231" y="581.408" fill="#000" font-size="12" textLength="112.669" font-family="'Noto Sans CJK JP'">400 INVALID_QUERY</text><ellipse cx="206.566" cy="625.864" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="206.566" cy="625.864" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="135.066,474.328,278.065,474.328,290.065,490.256,278.065,506.184,135.066,506.184,123.066,490.256,135.066,474.328" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="210.566" y="518.944" fill="#000" font-size="11" textLength="105.731" font-family="'Noto Sans CJK JP'">2.2 いずれかの項目が</text><text x="210.566" y="534.872" fill="#000" font-size="11" textLength="66" font-family="'Noto Sans CJK JP'">合わない場合</text><text x="135.066" y="487.088" fill="#000" font-size="11" textLength="142.999" font-family="'Noto Sans CJK JP'">クエリのいずれかの項目が、</text><text x="135.066" y="503.016" fill="#000" font-size="11" textLength="138.104" font-family="'Noto Sans CJK JP'">手順2の条件に合わない場合</text><text x="290.065" y="471.16" fill="#000" font-size="11" textLength="94.731" font-family="'Noto Sans CJK JP'">2.1 すべての項目が</text><text x="290.065" y="487.088" fill="#000" font-size="11" textLength="44" font-family="'Noto Sans CJK JP'">合う場合</text><path d="M416.975,691.828 L416.975,702.24 L396.975,706.24 L416.975,710.24 L416.975,720.652 A0,0 0 0 0 416.975,720.652 L621.951,720.652 A0,0 0 0 0 621.951,720.652 L621.951,701.828 L611.951,691.828 L416.975,691.828 A0,0 0 0 0 416.975,691.828" style="strok