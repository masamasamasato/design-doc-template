<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1238px;height:561px;background:#FFFFFF;" width="1238px" height="561px" viewBox="0 0 1238 561" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="8"><text x="569.3" y="36.24" fill="#000" font-size="14" textLength="98" font-weight="700" font-family="'Noto Sans CJK JP'">商品を検索する</text></g><path d="M675.571,56.272 L675.571,66.684 L655.571,70.684 L675.571,74.684 L675.571,85.096 A0,0 0 0 0 675.571,85.096 L956.571,85.096 A0,0 0 0 0 956.571,85.096 L956.571,66.272 L946.571,56.272 L675.571,56.272 A0,0 0 0 0 675.571,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M946.571,56.272 L946.571,66.272 L956.571,66.272 L946.571,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="681.571" y="76.352" fill="#000" font-size="13" textLength="260" font-family="'Noto Sans CJK JP'">読むだけ。どの枝でも、保存も削除もしない</text><ellipse cx="645.571" cy="70.684" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="469.495" y="105.096" width="352.151" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="479.495" y="129.016" fill="#000" font-size="12" textLength="84.001" font-family="'Noto Sans CJK JP'">セッション検証</text><text x="479.495" y="146.392" fill="#000" font-size="12" textLength="332.151" font-family="'Noto Sans CJK JP'">リクエストの Cookie を、保存済みの有効なセッションと照合</text><text x="479.495" y="163.768" fill="#000" font-size="12" textLength="91.669" font-family="'Noto Sans CJK JP'">requireSession()</text><polygon points="559.337,208.748,731.804,208.748,743.804,220.748,731.804,232.748,559.337,232.748,547.337,220.748,559.337,208.748" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="559.337" y="225.544" fill="#000" font-size="11" textLength="172.468" font-family="'Noto Sans CJK JP'">セッションの Cookie が有効な場合</text><text x="492.337" y="217.58" fill="#000" font-size="11" textLength="55" font-family="'Noto Sans CJK JP'">有効な場合</text><text x="743.804" y="201.652" fill="#000" font-size="11" textLength="150.468" font-family="'Noto Sans CJK JP'">セッションの Cookie が無い、</text><text x="743.804" y="217.58" fill="#000" font-size="11" textLength="87.999" font-family="'Noto Sans CJK JP'">または無効な場合</text><rect x="127.37" y="242.748" width="342.814" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="137.37" y="266.668" fill="#000" font-size="12" textLength="108.001" font-family="'Noto Sans CJK JP'">検索語と指定の検証</text><text x="137.37" y="284.044" fill="#000" font-size="12" textLength="322.814" font-family="'Noto Sans CJK JP'">q の文字数と、page・limit・sort・order を、決まりと照合</text><text x="137.37" y="301.42" fill="#000" font-size="12" textLength="95.701" font-family="'Noto Sans CJK JP'">searchProducts()</text><polygon points="135.29,342.472,462.263,342.472,474.263,358.4,462.263,374.328,135.29,374.328,123.29,358.4,135.29,342.472" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="135.29" y="355.232" fill="#000" font-size="11" textLength="326.973" font-family="'Noto Sans CJK JP'">q が1〜100文字で、page が1以上の整数、limit が1〜100の整数、</text><text x="135.29" y="371.16" fill="#000" font-size="11" textLength="278.21" font-family="'Noto Sans CJK JP'">sort が created_at か price、order が asc か descの場合</text><text x="24.291" y="355.232" fill="#000" font-size="11" textLength="98.999" font-family="'Noto Sans CJK JP'">決まりどおりの場合</text><text x="474.263" y="339.304" fill="#000" font-size="11" textLength="430.867" font-family="'Noto Sans CJK JP'">q が無い・空・100文字超、page が1以上の整数でない、limit が1〜100の整数でない、</text><text x="474.263" y="355.232" fill="#000" font-size="11" textLength="352.746" font-family="'Noto Sans CJK JP'">sort が created_at・price 以外、または order が asc・desc 以外の場合</text><path d="M210.669,387.88 L210.669,407.704 L190.669,411.704 L210.669,415.704 L210.669,435.528 A0,0 0 0 0 210.669,435.528 L407.884,435.528 A0,0 0 0 0 407.884,435.528 L407.884,397.88 L397.884,387.88 L210.669,387.88 A0,0 0 0 0 210.669,387.88" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M397.884,387.88 L397.884,397.88 L407.884,397.88 L397.884,387.88" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="216.669" y="407.96" fill="#000" font-size="13" textLength="130" font-family="'Noto Sans CJK JP'">保存も削除もしない。</text><text x="216.669" y="426.784" fill="#000" font-size="13" textLength="176.215" font-family="'Noto Sans CJK JP'">0件でも成功。空の結果を返す</text><rect x="16" y="384.328" width="174.669" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="408.248" fill="#000" font-size="12" textLength="154.669" font-family="'Noto Sans CJK JP'">200 商品名に検索語を含む、</text><text x="26" y="425.624" fill="#000" font-size="12" textLength="108.001" font-family="'Noto Sans CJK JP'">公開中の商品を返す</text><path d="M580.553,387.88 L580.553,407.704 L560.553,411.704 L580.553,415.704 L580.553,435.528 A0,0 0 0 0 580.553,435.528 L822.839,435.528 A0,0 0 0 0 822.839,435.528 L822.839,397.88 L812.839,387.88 L580.553,387.88 A0,0 0 0 0 580.553,387.88" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M812.839,387.88 L812.839,397.88 L822.839,397.88 L812.839,387.88" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="586.553" y="407.96" fill="#000" font-size="13" textLength="130" font-family="'Noto Sans CJK JP'">保存も削除もしない。</text><text x="586.553" y="426.784" fill="#000" font-size="13" textLength="221.286" font-family="'Noto Sans CJK JP'">例：検索語が空、101文字、limit=200</text><rect x="427.884" y="384.328" width="132.669" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="437.884" y="408.248" fill="#000" font-size="12" t