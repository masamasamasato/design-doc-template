<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1169px;height:561px;background:#FFFFFF;" width="1169px" height="561px" viewBox="0 0 1169 561" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="8"><text x="520.572" y="36.24" fill="#000" font-size="14" textLength="125.999" font-weight="700" font-family="'Noto Sans CJK JP'">商品一覧を取得する</text></g><path d="M645.343,56.272 L645.343,66.684 L625.343,70.684 L645.343,74.684 L645.343,85.096 A0,0 0 0 0 645.343,85.096 L926.343,85.096 A0,0 0 0 0 926.343,85.096 L926.343,66.272 L916.343,56.272 L645.343,56.272 A0,0 0 0 0 645.343,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M916.343,56.272 L916.343,66.272 L926.343,66.272 L916.343,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="651.343" y="76.352" fill="#000" font-size="13" textLength="260" font-family="'Noto Sans CJK JP'">読むだけ。どの枝でも、保存も削除もしない</text><ellipse cx="615.343" cy="70.684" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="439.268" y="105.096" width="352.151" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="449.268" y="129.016" fill="#000" font-size="12" textLength="84.001" font-family="'Noto Sans CJK JP'">セッション検証</text><text x="449.268" y="146.392" fill="#000" font-size="12" textLength="332.151" font-family="'Noto Sans CJK JP'">リクエストの Cookie を、保存済みの有効なセッションと照合</text><text x="449.268" y="163.768" fill="#000" font-size="12" textLength="91.669" font-family="'Noto Sans CJK JP'">requireSession()</text><polygon points="529.109,208.748,701.577,208.748,713.577,220.748,701.577,232.748,529.109,232.748,517.109,220.748,529.109,208.748" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="529.109" y="225.544" fill="#000" font-size="11" textLength="172.468" font-family="'Noto Sans CJK JP'">セッションの Cookie が有効な場合</text><text x="462.109" y="217.58" fill="#000" font-size="11" textLength="55" font-family="'Noto Sans CJK JP'">有効な場合</text><text x="713.577" y="201.652" fill="#000" font-size="11" textLength="150.468" font-family="'Noto Sans CJK JP'">セッションの Cookie が無い、</text><text x="713.577" y="217.58" fill="#000" font-size="11" textLength="87.999" font-family="'Noto Sans CJK JP'">または無効な場合</text><rect x="153.434" y="242.748" width="308.686" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="163.434" y="266.668" fill="#000" font-size="12" textLength="60" font-family="'Noto Sans CJK JP'">指定の検証</text><text x="163.434" y="284.044" fill="#000" font-size="12" textLength="288.686" font-family="'Noto Sans CJK JP'">page・limit・sort・order を、用語集の決まりと照合</text><text x="163.434" y="301.42" fill="#000" font-size="12" textLength="75.469" font-family="'Noto Sans CJK JP'">listProducts()</text><polygon points="167.44,342.472,448.114,342.472,460.114,358.4,448.114,374.328,167.44,374.328,155.44,358.4,167.44,342.472" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="167.44" y="355.232" fill="#000" font-size="11" textLength="227.269" font-family="'Noto Sans CJK JP'">page が1以上の整数、limit が1〜100の整数、</text><text x="167.44" y="371.16" fill="#000" font-size="11" textLength="280.674" font-family="'Noto Sans CJK JP'">sort が created_at か price、order が asc か desc の場合</text><text x="56.44" y="355.232" fill="#000" font-size="11" textLength="98.999" font-family="'Noto Sans CJK JP'">決まりどおりの場合</text><text x="460.114" y="339.304" fill="#000" font-size="11" textLength="293.269" font-family="'Noto Sans CJK JP'">page が1未満か整数でない、limit が1〜100の整数でない、</text><text x="460.114" y="355.232" fill="#000" font-size="11" textLength="182.808" font-family="'Noto Sans CJK JP'">sort・order が決まりにない値の場合</text><