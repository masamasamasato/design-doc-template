" y="188.68" fill="#000" font-size="11" textLength="22" font-family="'Noto Sans CJK JP'">はい</text><text x="464.947" y="188.68" fill="#000" font-size="11" textLength="33" font-family="'Noto Sans CJK JP'">いいえ</text><rect x="16" y="213.848" width="128.889" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="237.768" fill="#000" font-size="12" textLength="60" font-family="'Noto Sans CJK JP'">失敗を返す</text><text x="26" y="255.144" fill="#000" font-size="12" textLength="108.889" font-family="'Noto Sans CJK JP'">ACCOUNT_LOCKED</text><polygon points="661.631,213.848,798.844,213.848,810.844,225.848,798.844,237.848,661.631,237.848,649.631,225.848,661.631,213.848" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="661.631" y="230.644" fill="#000" font-size="11" textLength="137.213" font-family="'Noto Sans CJK JP'">メールとパスワードは合う?</text><text x="627.631" y="222.68" fill="#000" font-size="11" textLength="22" font-family="'Noto Sans CJK JP'">はい</text><text x="810.844" y="222.68" fill="#000" font-size="11" textLength="33" font-family="'Noto Sans CJK JP'">いいえ</text><rect x="178.889" y="247.848" width="140.001" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="188.889" y="271.768" fill="#000" font-size="12" textLength="120.001" font-family="'Noto Sans CJK JP'">セッションを作る処理</text><text x="188.889" y="289.144" fill="#000" font-size="12" textLength="86.389" font-family="'Noto Sans CJK JP'">createSession()</text><path d="M362.89,350.565 L362.89,360.977 L342.89,364.977 L362.89,368.977 L362.89,379.389 A0,0 0 0 0 362.89,379.389 L1037.569,379.389 A0,0 0 0 0 1037.569,379.389 L1037.569,360.565 L1027.569,350.565 L362.89,350.565 A0,0 0 0 0 362.89,350.565" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1027.569,350.565 L1027.569,360.565 L1037.569,360.565 L1027.569,350.565" style="stroke:#181818;stroke-width:0.5;" fill