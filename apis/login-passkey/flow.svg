<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1641px;height:882px;background:#FFFFFF;" width="1641px" height="882px" viewBox="0 0 1641 882" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="8"><text x="742.598" y="36.24" fill="#000" font-size="14" textLength="153.999" font-weight="700" font-family="'Noto Sans CJK JP'">パスキーでログインする</text></g><path d="M899.372,56.272 L899.372,76.096 L879.372,80.096 L899.372,84.096 L899.372,103.92 A0,0 0 0 0 899.372,103.92 L1245.373,103.92 A0,0 0 0 0 1245.373,103.92 L1245.373,66.272 L1235.373,56.272 L899.372,56.272 A0,0 0 0 0 899.372,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M1235.373,56.272 L1235.373,66.272 L1245.373,66.272 L1235.373,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="905.372" y="76.352" fill="#000" font-size="13" textLength="312" font-family="'Noto Sans CJK JP'">メールアドレスは入れない。セッションを作る前に、</text><text x="905.372" y="95.176" fill="#000" font-size="13" textLength="325" font-family="'Noto Sans CJK JP'">印とチャレンジの組、署名、署名カウンタの検証が必要</text><ellipse cx="869.372" cy="80.096" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><path d="M1007.373,127.472 L1007.373,147.296 L987.373,151.296 L1007.373,155.296 L1007.373,175.12 A0,0 0 0 0 1007.373,175.12 L1373.589,175.12 A0,0 0 0 0 1373.589,175.12 L1373.589,137.472 L1363.589,127.472 L1007.373,127.472 A0,0 0 0 0 1007.373,127.472" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M1363.589,127.472 L1363.589,137.472 L1373.589,137.472 L1363.589,127.472" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="1013.373" y="147.552" fill="#000" font-size="13" textLength="345.215" font-family="'Noto Sans CJK JP'">保存：チャレンジと一時的な印の組（例：5分で消える）。</text><text x="1013.373" y="166.376" fill="#000" font-size="13" textLength="224.042" font-family="'Noto Sans CJK JP'">印は5分の Cookie でブラウザに付ける</text><rect x="751.372" y="123.92" width="236.002" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="761.372" y="147.84" fill="#000" font-size="12" textLength="216.002" font-family="'Noto Sans CJK JP'">ログイン用のチャレンジを発行する処理</text><text x="761.372" y="165.216" fill="#000" font-size="12" textLength="112.129" font-family="'Noto Sans CJK JP'">issueLoginOptions()</text><path d="M997.227,211.636 L997.227,222.048 L977.227,226.048 L997.227,230.048 L997.227,240.46 A0,0 0 0 0 997.227,240.46 L1318.488,240.46 A0,0 0 0 0 1318.488,240.46 L1318.488,221.636 L1308.488,211.636 L997.227,211.636 A0,0 0 0 0 997.227,211.636" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M1308.488,211.636 L1308.488,221.636 L1318.488,221.636 L1308.488,211.636" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="1003.227" y="231.716" fill="#000" font-size="13" textLength="300.261" font-family="'Noto Sans CJK JP'">端末で PIN か生体認証をする。ここはサーバーの外</text><rect x="761.518" y="198.672" width="215.709" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="771.518" y="222.592" fill="#000" font-size="12" textLength="180.001" font-family="'Noto Sans CJK JP'">画面がチャレンジを端末へ渡し、</text><text x="771.518" y="239.968" fill="#000" font-size="12" textLength="195.709" font-family="'Noto Sans CJK JP'">端末の署名（assertion）を受け取る</text><rect x="667.371" y="273.424" width="404.003" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="677.371" y="297.345" fill="#000" font-size="12" textLength="108.001" font-family="'Noto Sans CJK JP'">印・チャレンジ検証</text><text x="677.371" y="314.721" fill="#000" font-size="12" textLength="384.003" font-family="'Noto Sans CJK JP'">ブラウザの一時的な印とチャレンジの組を、発行時に保存した組と照合</text><text x="677.371" y="332.097" fill="#000" font-size="12" textLength="91.369" font-family="'Noto Sans CJK JP'">verifyAssertion()</text><polygon points="748.373,373.149,990.372,373.149,1002.372,389.077,990.372,405.004,748.373,405.004,736.373,389.077,748.373,373.149" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="748.373" y="385.909" fill="#000" font-size="11" textLength="241.998" font-family="'Noto Sans CJK JP'">印があり、チャレンジとの組が発行時と同じで、</text><text x="748.373" y="401.836" fill="#000" font-size="11" textLength="182.104" font-family="'Noto Sans CJK JP'">チャレンジが5分以内・未使用の場合</text><text x="670.374" y="385.909" fill="#000" font-size="11" textLength="66" font-family="'Noto Sans CJK JP'">組が同じ場合</text><text x="1002.372" y="369.981" fill="#000" font-size="11" textLength="153.999" font-family="'Noto Sans CJK JP'">印が無い、組が発行時と違う、</text><text x="1002.372" y="385.909" fill="#000" font-size="11" textLength="230.998" font-family="'Noto Sans CJK JP'">またはチャレンジが期限切れ・使用済みの場合</text><rect x="265.382" y="415.004" width="350.398" height="89.504" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="275.382" y="438.925" fill="#000" font-size="12" textLength="78.397" font-family="'Noto Sans CJK JP'">assertion 検証</text><text x="275.382" y="456.301" fill="#000" font-size="12" textLength="330.398" font-family="'Noto Sans CJK JP'">assertion の署名を、保存した公開鍵とチャレンジで照合し、</text><text x="275.382" y="473.677" fill="#000" font-size="12" textLength="168.001" font-family="'Noto Sans CJK JP'">署名カウンタを保存値と比べる</text><text x="275.382" y="491.053" fill="#000" font-size="12" textLength="91.369" font-family="'Noto Sans CJK JP'">verifyAssertion()</text><polygon points="282.49,532.105,598.672,532.105,610.672,548.033,598.672,563.961,282.49,563.961,270.49,548.033,282.49,532.105" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="282.49" y="544.865" fill="#000" font-size="11" textLength="272.831" font-family="'Noto Sans CJK JP'">credential ID のパスキーがあり、署名・origin・rpId・</text><text x="282.49" y="560.793" fill="#000" font-size="11" textLength="316.182" font-family="'Noto Sans CJK JP'">user verification が合い、署名カウンタが保存値より大きい場合</text><text x="193.491" y="544.865" fill="#000" font-size="11" textLength="76.999" font-family="'Noto Sans CJK JP'">すべて合う場合</text><text x="610.672" y="528.937" fill="#000" font-size="11" textLength="290.211" font-family="'Noto Sans CJK JP'">パスキーが無い、署名・origin・rpId・user verification の</text><text x="610.672" y="544.865" fill="#000" font-size="11" textLength="296.998" font-family="'Noto Sans CJK JP'">どれかが合わない、または署名カウンタが保存値以下の場合</text><path d="M202.065,586.925 L202.065,597.337 L182.065,601.337 L202.065,605.337 L202.065,615.749 A0,0 0 0 0 202.065,615.749 L588.495,615.749 A0,0 0 0 0 588.495,615.749 L588.495,596.925 L578.495,586.925 L202.065,586.925 A0,0 0 0 0 202.065,586.925" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M578.495,586.925 L578.495,596.925 L588.495,596.925 L578.495,586.925" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="208.065" y="607.005" fill="#000" font-size="13" textLength="365.43" font-family="'Noto Sans CJK JP'">保存：セッション（例：24時間有効）と、新しい署名カウンタ</text><rect x="42.064" y="573.961" width="140.001" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="52.064" y="597.881" fill="#000" font-size="12" textLength="120.001" font-family="'Noto Sans CJK JP'">セッションを作る処理</text><text x="52.064" y="615.257" fill="#000" font-size="12" textLength="86.389" font-family="'Noto Sans CJK JP'">createSession()</text><path d="M226.065,661.677 L226.065,672.089 L206.065,676.089 L226.065,680.089 L226.065,690.501 A0,0 0 0 0 226.065,690.501 L663.066,690.501 A0,0 0 0 0 663.066,690.501 L663.066,671.677 L653.066,661.677 L226.065,661.677 A0,0 0 0 0 226.065,661.677" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M653.066,661.677 L653.066,671.677 L663.066,671.677 L653.066,661.677" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="232.065" y="681.757" fill="#000" font-size="13" textLength="416" font-family="'Noto Sans CJK JP'">パスワードのログインと同じ。送信に失敗してもログインは成功のまま</text><rect x="18.064" y="648.713" width="188.001" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="28.064" y="672.633" fill="#000" font-size="12" textLength="168.001" font-family="'Noto Sans CJK JP'">ログイン通知メールを送る処理</text><text x="28.064" y="690.009" fill="#000" font-size="12" textLength="71.857" font-family="'Noto Sans CJK JP'">notifyLogin()</text><path d="M228.129,727.741 L228.129,738.153 L208.129,742.153 L228.129,746.153 L228.129,756.565 A0,0 0 0 0 228.129,756.565 L431.129,756.565 A0,0 0 0 0 431.129,756.565 L431.129,737.741 L421.129,727.741 L228.129,727.741 A0,0 0 0 0 228.129,727.741" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M421.129,727.741 L421.129,737.741 L431.129,737.741 L421.129,727.741" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="234.129" y="747.821" fill="#000" font-size="13" textLength="182" font-family="'Noto Sans CJK JP'">削除：一時的な印とチャレンジ</text><rect x="16" y="723.465" width="192.129" height="37.376" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="747.385" fill="#000" font-size="12" textLength="172.129" font-family="'Noto Sans CJK JP'">200 Cookie でセッションを返す</text><path d="M875.131,577.513 L875.131,597.337 L855.131,601.337 L875.131,605.337 L875.131,625.161 A0,0 0 0 0 875.131,625.161 L1182.131,625.161 A0,0 0 0 0 1182.131,625.161 L1182.131,587.513 L1172.131,577.513 L875.131,577.513 A0,0 0 0 0 875.131,577.513" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M1172.131,577.513 L1172.131,587.513 L1182.131,587.513 L1172.131,577.513" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="881.131" y="597.593" fill="#000" font-size="13" textLength="195" font-family="'Noto Sans CJK JP'">削除：一時的な印とチャレンジ。</text><text x="881.131" y="616.417" fill="#000" font-size="13" textLength="286" font-family="'Noto Sans CJK JP'">セッションは作らない。どこが違うかは返さない</text><rect x="683.066" y="573.961" width="172.065" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="693.066" y="597.881" fill="#000" font-size="12" textLength="60" font-family="'Noto Sans CJK JP'">失敗を返す</text><text x="693.066" y="615.257" fill="#000" font-size="12" textLength="152.065" font-family="'Noto Sans CJK JP'">401 INVALID_CREDENTIALS</text><polygon points="440.581,766.841,452.581,778.841,440.581,790.841,428.581,778.841,440.581,766.841" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1404.196,418.557 L1404.196,438.381 L1384.196,442.381 L1404.196,446.381 L1404.196,466.205 A0,0 0 0 0 1404.196,466.205 L1620.196,466.205 A0,0 0 0 0 1620.196,466.205 L1620.196,428.557 L1610.196,418.557 L1404.196,418.557 A0,0 0 0 0 1404.196,418.557" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M1610.196,418.557 L1610.196,428.557 L1620.196,428.557 L1610.196,418.557" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="1410.196" y="438.637" fill="#000" font-size="13" textLength="195" font-family="'Noto Sans CJK JP'">削除：一時的な印とチャレンジ。</text><text x="1410.196" y="457.461" fill="#000" font-size="13" textLength="130" font-family="'Noto Sans CJK JP'">セッションは作らない</text><rect x="1212.131" y="415.004" width="172.065" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1222.131" y="438.925" fill="#000" font-size="12" textLength="60" font-family="'Noto Sans CJK JP'">失敗を返す</text><text x="1222.131" y="456.301" fill="#000" font-size="12" textLength="152.065" font-family="'Noto Sans CJK JP'">401 INVALID_CREDENTIALS</text><polygon points="869.372,796.841,881.372,808.841,869.372,820.841,857.372,808.841,869.372,796.841" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><ellipse cx="869.372" cy="851.8