<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:795px;height:1019px;background:#FFFFFF;" width="795px" height="1019px" viewBox="0 0 795 1019" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="8"><text x="329.474" y="36.24" fill="#000" font-size="14" textLength="134.931" font-weight="700" font-family="'Noto Sans CJK JP'">パスキーログインAPI</text></g><ellipse cx="213.447" cy="66.272" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><path d="M334.618,99.824 L334.618,119.648 L314.618,123.648 L334.618,127.648 L334.618,147.472 A0,0 0 0 0 334.618,147.472 L700.833,147.472 A0,0 0 0 0 700.833,147.472 L700.833,109.824 L690.833,99.824 L334.618,99.824 A0,0 0 0 0 334.618,99.824" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M690.833,99.824 L690.833,109.824 L700.833,109.824 L690.833,99.824" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="340.618" y="119.904" fill="#000" font-size="13" textLength="345.215" font-family="'Noto Sans CJK JP'">保存：チャレンジと一時的な印の組（例：5分で消える）。</text><text x="340.618" y="138.728" fill="#000" font-size="13" textLength="190.827" font-family="'Noto Sans CJK JP'">印は Cookie でブラウザに付ける</text><rect x="112.277" y="96.272" width="202.341" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="122.277" y="120.192" fill="#000" font-size="12" textLength="96.685" font-family="'Noto Sans CJK JP'">1. チャレンジ発行</text><text x="122.277" y="137.568" fill="#000" font-size="12" textLength="182.341" font-family="'Noto Sans CJK JP'">POST /sessions/passkey/options</text><path d="M341.302,183.988 L341.302,194.4 L321.302,198.4 L341.302,202.4 L341.302,212.812 A0,0 0 0 0 341.302,212.812 L662.563,212.812 A0,0 0 0 0 662.563,212.812 L662.563,193.988 L652.563,183.988 L341.302,183.988 A0,0 0 0 0 341.302,183.988" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M652.563,183.988 L652.563,193.988 L662.563,193.988 L652.563,183.988" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="347.302" y="204.068" fill="#000" font-size="13" textLength="300.261" font-family="'Noto Sans CJK JP'">端末で PIN か生体認証をする。ここはサーバーの外</text><rect x="105.593" y="171.024" width="215.709" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="115.593" y="194.944" fill="#000" font-size="12" textLength="180.001" font-family="'Noto Sans CJK JP'">画面がチャレンジを端末へ渡し、</text><text x="115.593" y="212.32" fill="#000" font-size="12" textLength="195.709" font-family="'Noto Sans CJK JP'">端末の署名（assertion）を受け取る</text><rect x="16" y="245.776" width="394.895" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="269.696" fill="#000" font-size="12" textLength="120.685" font-family="'Noto Sans CJK JP'">2. 印・チャレンジ検証</text><text x="26" y="287.073" fill="#000" font-size="12" textLength="374.895" font-family="'Noto Sans CJK JP'">POST /sessions/passkey。印とチャレンジの組を、保存した組と照合</text><path d="M319.48,397.46 L319.48,417.284 L299.48,421.284 L319.48,425.284 L319.48,445.108 A0,0 0 0 0 319.48,445.108 L535.48,445.108 A0,0 0 0 0 535.48,445.108 L535.48,407.46 L525.48,397.46 L319.48,397.46 A0,0 0 0 0 319.48,397.46" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M525.48,397.46 L525.48,407.46 L535.48,407.46 L525.48,397.46" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="325.48" y="417.54" fill="#000" font-size="13" textLength="195" font-family="'Noto Sans CJK JP'">削除：一時的な印とチャレンジ。</text><text x="325.48" y="436.364" fill="#000" font-size="13" textLength="130" font-family="'Noto Sans CJK JP'">セッションは作らない</text><rect x="127.415" y="393.908" width="172.065" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="137.415" y="417.828" fill="#000" font-size="12" textLength="60" font-family="'Noto Sans CJK JP'">失敗を返す</text><text x="137.415" y="435.204" fill="#000" font-size="12" textLength="152.065" font-family="'Noto Sans CJK JP'">401 INVALID_CREDENTIALS</text><ellipse cx="213.447" cy="479.66" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="213.447" cy="479.66" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="61.252,328.124,365.642,328.124,377.642,344.052,365.642,359.98,61.252,359.98,49.252,344.052,61.252,328.124" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="217.447" y="372.74" fill="#000" font-size="11" textLength="39.732" font-family="'Noto Sans CJK JP'">2.2 組が</text><text x="217.447" y="388.668" fill="#000" font-size="11" textLength="66" font-family="'Noto Sans CJK JP'">使えない場合</text><text x="61.252" y="340.884" fill="#000" font-size="11" textLength="290.926" font-family="'Noto Sans CJK JP'">リクエストに印が無い または 印が保存済みの組と合わない</text><text x="61.252" y="356.812" fill="#000" font-size="11" textLength="304.39" font-family="'Noto Sans CJK JP'">または その組のチャレンジが期限切れ または 使用済みの場合</text><text x="377.642" y="324.957" fill="#000" font-size="11" textLength="39.732" font-family="'Noto Sans CJK JP'">2.1 組が</text><text x="377.642" y="340.884" fill="#000" font-size="11" textLength="55" font-family="'Noto Sans CJK JP'">使える場合</text><rect x="83.446" y="532.66" width="260.002" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="93.446" y="556.58" fill="#000" font-size="12" textLength="91.081" font-family="'Noto Sans CJK JP'">3. assertion 検証</text><text x="93.446" y="573.957" fill="#000" font-size="12" textLength="240.002" font-family="'Noto Sans CJK JP'">署名を、保存した公開鍵とチャレンジで照合</text><path d="M319.48,692.676 L319.48,712.5 L299.48,716.5 L319.48,720.5 L319.48,740.324 A0,0 0 0 0 319.48,740.324 L626.48,740.324 A0,0 0 0 0 626.48,740.324 L626.48,702.676 L616.48,692.676 L319.48,692.676 A0,0 0 0 0 319.48,692.676" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M616.48,692.676 L616.48,702.676 L626.48,702.676 L616.48,692.676" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="325.48" y="712.756" fill="#000" font-size="13" textLength="195" font-family="'Noto Sans CJK JP'">削除：一時的な印とチャレンジ。</text><text x="325.48" y="731.58" fill="#000" font-size="13" textLength="286" font-family="'Noto Sans CJK JP'">セッションは作らない。どこが違うかは返さない</text><rect x="127.415" y="689.124" width="172.065" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="137.415" y="713.044" fill="#000" font-size="12" textLength="60" font-family="'Noto Sans CJK JP'">失敗を返す</text><text x="137.415" y="730.42" fill="#000" font-size="12" textLength="152.065" font-family="'Noto Sans CJK JP'">401 INVALID_CREDENTIALS</text><ellipse cx="213.447" cy="774.876" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="213.447" cy="774.876" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="52.238,607.413,374.657,607.413,386.657,631.304,374.657,655.196,52.238,655.196,40.238,631.304,52.238,607.413" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="217.447" y="667.956" fill="#000" font-size="11" textLength="72.731" font-family="'Noto Sans CJK JP'">3.2 いずれかが</text><text x="217.447" y="683.884" fill="#000" font-size="11" textLength="66" font-family="'Noto Sans CJK JP'">合わない場合</text><text x="52.238" y="620.173" fill="#000" font-size="11" textLength="322.419" font-family="'Noto Sans CJK JP'">パスキーが無い または 署名・origin・rpId のいずれかが合わない</text><text x="52.238" y="636.1" fill="#000" font-size="11" textLength="197.647" font-family="'Noto Sans CJK JP'">または user verification のフラグが無い</text><text x="52.238" y="652.028" fill="#000" font-size="11" textLength="200.463" font-family="'Noto Sans CJK JP'">または 署名カウンタが保存値以下の場合</text><text x="386.657" y="612.209" fill="#000" font-size="11" textLength="50.732" font-family="'Noto Sans CJK JP'">3.1 すべて</text><text x="386.657" y="628.136" fill="#000" font-size="11" textLength="44" font-family="'Noto Sans CJK JP'">合う場合</text><path d="M375.448,831.429 L375.448,851.253 L355.448,855.253 L375.448,859.253 L375.448,879.077 A0,0 0 0 0 375.448,879.077 L774.879,879.077 A0,0 0 0 0 774.879,879.077 L774.879,841.429 L764.879,831.429 L375.448,831.429 A0,0 0 0 0 375.448,831.429" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M764.879,831.429 L764.879,841.429 L774.879,841.429 L764.879,831.429" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="381.448" y="851.509" fill="#000" font-size="13" textLength="378.43" font-family="'Noto Sans CJK JP'">保存：セッション（例：24時間有効）と、新しい署名カウンタ。</text><text x="381.448" y="870.333" fill="#000" font-size="13" textLength="299" font-family="'Noto Sans CJK JP'">メールの送信に失敗しても、ログインは成功のまま</text><rect x="71.446" y="827.876" width="284.002" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="81.446" y="851.796" fill="#000" font-size="12" textLength="96.685" font-family="'Noto Sans CJK JP'">4. セッション作成</text><text x="81.446" y="869.173" fill="#000" font-size="12" textLength="264.002" font-family="'Noto Sans CJK JP'">セッションを保存し、ログイン通知メールを送る</text><path d="M329.512,915.593 L329.512,926.005 L309.512,930.005 L329.512,934.005 L329.512,944.417 A0,0 0 0 0 329.512,944.417 L532.512,944.417 A0,0 0 0 0 532.512,944.417 L532.512,925.593 L522.512,915.593 L329.512,915.593 A0,0 0 0 0 329.512,915.593" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><path d="M522.512,915.593 L522.512,925.593 L532.512,925.593 L522.512,915.593" style="stroke:#181818;stroke-width:0.5;" fill="#FFC"/><text x="335.512" y="935.673" fill="#000" font-size="13" textLength="182" font-family="'Noto Sans CJK JP'">削除：一時的な印とチャレンジ</text><rect x="117.383" y="902.629" width="192.129" height="54.752" fill="#F1F1F1" s