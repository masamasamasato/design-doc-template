<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1038px;height:642px;background:#FFFFFF;" width="1038px" height="642px" viewBox="0 0 1038 642" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="7"><text x="441.493" y="36.24" fill="#000" font-size="14" textLength="153.999" font-weight="700" font-family="'Noto Sans CJK JP'">パスキーでログインする</text></g><path d="M464.644,56.272 L464.644,66.684 L444.644,70.684 L464.644,74.684 L464.644,85.096 A0,0 0 0 0 464.644,85.096 L940.644,85.096 A0,0 0 0 0 940.644,85.096 L940.644,66.272 L930.644,56.272 L464.644,56.272 A0,0 0 0 0 464.644,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M930.644,56.272 L930.644,66.272 L940.644,66.272 L930.644,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="470.644" y="76.352" fill="#000" font-size="13" textLength="455" font-family="'Noto Sans CJK JP'">メールは入れない。セッションを作る前に、署名と署名カウンタの確認が必要</text><ellipse cx="434.644" cy="70.684" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><path d="M572.645,118.06 L572.645,128.472 L552.645,132.472 L572.645,136.472 L572.645,146.884 A0,0 0 0 0 572.645,146.884 L769.86,146.884 A0,0 0 0 0 769.86,146.884 L769.86,128.06 L759.86,118.06 L572.645,118.06 A0,0 0 0 0 572.645,118.06" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M759.86,118.06 L759.86,128.06 L769.86,128.06 L759.86,118.06" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="578.645" y="138.14" fill="#000" font-size="13" textLength="176.215" font-family="'Noto Sans CJK JP'">画面に返し、5分だけ保存する</text><rect x="316.643" y="105.096" width="236.002" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="326.643" y="129.016" fill="#000" font-size="12" textLength="216.002" font-family="'Noto Sans CJK JP'">ログイン用のチャレンジを発行する処理</text><text x="326.643" y="146.392" fill="#000" font-size="12" textLength="112.129" font-family="'Noto Sans CJK JP'">issueLoginOptions()</text><path d="M562.499,192.812 L562.499,203.224 L542.499,207.224 L562.499,211.224 L562.499,221.636 A0,0 0 0 0 562.499,221.636 L883.76,221.636 A0,0 0 0 0 883.76,221.636 L883.76,202.812 L873.76,192.812 L562.499,192.812 A0,0 0 0 0 562.499,192.812" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M873.76,192.812 L873.76,202.812 L883.76,202.812 L873.76,192.812" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="568.499" y="212.892" fill="#000" font-size="13" textLength="300.261" font-family="'Noto Sans CJK JP'">端末で PIN か生体認証をする。ここはサーバーの外</text><rect x="326.789" y="179.848" width="215.709" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="336.789" y="203.768" fill="#000" font-size="12" textLength="180.001" font-family="'Noto Sans CJK JP'">画面がチャレンジを端末へ渡し、</text><text x="336.789" y="221.144" fill="#000" font-size="12" textLength="195.709" font-family="'Noto Sans CJK JP'">端末の署名（assertion）を受け取る</text><rect x="355.445" y="254.6" width="158.397" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="365.445" y="278.521" fill="#000" font-size="12" textLength="138.397" font-family="'Noto Sans CJK JP'">assertion を検証する処理</text><text x="365.445" y="295.897" fill="#000" font-size="12" textLength="91.369" font-family="'Noto Sans CJK JP'">verifyAssertion()</text><polygon points="311.038,329.353,558.25,329.353,570.25,341.353,558.25,353.353,311.038,353.353,299.038,341.353,311.038,329.353" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="311.038" y="346.149" fill="#000" font-size="11" textLength="247.212" font-family="'Noto Sans CJK JP'">チャレンジと合い、カウンタが前より増えている?</text><text x="277.038" y="338.185" fill="#000" font-size="11" textLength="22" font-family="'Noto Sans CJK JP'">はい</text><text x="570.25" y="338.185" fill="#000" font-size="11" textLength="33" font-family="'Noto Sans CJK JP'">いいえ</text><rect x="40" y="363.353" width="140.001" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="50" y="387.273" fill="#000" font-size="12" textLength="120.001" font-family="'Noto Sans CJK JP'">セッションを作る処理</text><text x="50" y="404.649" fill="#000" font-size="12" textLength="86.389" font-family="'Noto Sans CJK JP'">createSession()</text><path d="M224.001,451.069 L224.001,461.481 L204.001,465.481 L224.001,469.481 L224.001,479.893 A0,0 0 0 0 224.001,479.893 L661.002,479.893 A0,0 0 0 0 661.002,479.893 L661.002,461.069 L651.002,451.069 L224.001,451.069 A0,0 0 0 0 224.001,451.069" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M651.002,451.069 L651.002,461.069 L661.002,461.069 L651.002,451.069" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="230.001" y="471.149" fill="#000" font-size="13" textLength="416" font-family="'Noto Sans CJK JP'">パスワードのログインと同じ。送信に失敗してもログインは成功のまま</text><rect x="16" y="438.105" width="188.001" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="462.025" fill="#000" font-size="12" textLength="168.001" font-family="'Noto Sans CJK JP'">ログイン通知メールを送る処理</text><text x="26" y="479.401" fill="#000" font-size="12" textLength="71.857" font-family="'Noto Sans CJK JP'">notifyLogin()</text><path d="M214.731,517.133 L214.731,527.545 L194.731,531.545 L214.731,535.545 L214.731,545.957 A0,0 0 0 0 214.731,545.957 L664.588,545.957 A0,0 0 0 0 664.588,545.957 L664.588,527.133 L654.588,517.133 L214.731,517.133 A0,0 0 0 0 214.731,517.133" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M654.588,517.133 L654.588,527.133 L664.588,527.133 L654.588,517.133" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="220.731" y=