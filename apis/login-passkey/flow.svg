<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1484px;height:800px;background:#FFFFFF;" width="1484px" height="800px" viewBox="0 0 1484 800" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="7"><text x="664.487" y="36.24" fill="#000" font-size="14" textLength="153.999" font-weight="700" font-family="'Noto Sans CJK JP'">パスキーでログインする</text></g><path d="M805.974,56.272 L805.974,66.684 L785.974,70.684 L805.974,74.684 L805.974,85.096 A0,0 0 0 0 805.974,85.096 L1463.974,85.096 A0,0 0 0 0 1463.974,85.096 L1463.974,66.272 L1453.974,56.272 L805.974,56.272 A0,0 0 0 0 805.974,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1453.974,56.272 L1453.974,66.272 L1463.974,66.272 L1453.974,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="811.974" y="76.352" fill="#000" font-size="13" textLength="637" font-family="'Noto Sans CJK JP'">メールアドレスは入れない。セッションを作る前に、印とチャレンジの組、署名、署名カウンタの検証が必要</text><ellipse cx="775.974" cy="70.684" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><path d="M913.975,118.06 L913.975,128.472 L893.975,132.472 L913.975,136.472 L913.975,146.884 A0,0 0 0 0 913.975,146.884 L1403.105,146.884 A0,0 0 0 0 1403.105,146.884 L1403.105,128.06 L1393.105,118.06 L913.975,118.06 A0,0 0 0 0 913.975,118.06" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1393.105,118.06 L1393.105,128.06 L1403.105,128.06 L1393.105,118.06" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="919.975" y="138.14" fill="#000" font-size="13" textLength="468.13" font-family="'Noto Sans CJK JP'">画面に返し、ブラウザに付ける一時的な印（5分の Cookie）と組にして保存する</text><rect x="657.973" y="105.096" width="236.002" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="667.973" y="129.016" fill="#000" font-size="12" textLength="216.002" font-family="'Noto Sans CJK JP'">ログイン用のチャレンジを発行する処理</text><text x="667.973" y="146.392" fill="#000" font-size="12" textLength="112.129" font-family="'Noto Sans CJK JP'">issueLoginOptions()</text><path d="M903.828,192.812 L903.828,203.224 L883.828,207.224 L903.828,211.224 L903.828,221.636 A0,0 0 0 0 903.828,221.636 L1225.09,221.636 A0,0 0 0 0 1225.09,221.636 L1225.09,202.812 L1215.09,192.812 L903.828,192.812 A0,0 0 0 0 903.828,192.812" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1215.09,192.812 L1215.09,202.812 L1225.09,202.812 L1215.09,192.812" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="909.828" y="212.892" fill="#000" font-size="13" textLength="300.261" font-family="'Noto Sans CJK JP'">端末で PIN か生体認証をする。ここはサーバーの外</text><rect x="668.119" y="179.848" width="215.709" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="678.119" y="203.768" fill="#000" font-size="12" textLength="180.001" font-family="'Noto Sans CJK JP'">画面がチャレンジを端末へ渡し、</text><text x="678.119" y="221.144" fill="#000" font-size="12" textLength="195.709" font-family="'Noto Sans CJK JP'">端末の署名（assertion）を受け取る</text><rect x="603.973" y="254.6" width="344.002" height="72.128" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="613.973" y="278.521" fill="#000" font-size="12" textLength="78.397" font-family="'Noto Sans CJK JP'">assertion 検証</text><text x="613.973" y="295.897" fill="#000" font-size="12" textLength="324.002" font-family="'Noto Sans CJK JP'">印とチャレンジの組、公開鍵での署名、署名カウンタを照合</text><text x="613.973" y="313.273" fill="#000" font-size="12" textLength="91.369" font-family="'Noto Sans CJK JP'">verifyAssertion()</text><polygon points="616.475,358.253,935.473,358.253,947.473,370.253,935.473,382.253,616.475,382.253,604.475,370.253,616.475,358.253" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="616.475" y="375.048" fill="#000" font-size="11" textLength="318.998" font-family="'Noto Sans CJK JP'">一時的な印とチャレンジの組が、発行時に保存した組と同じ場合</text><text x="560.475" y="367.085" fill="#000" font-size="11" textLength="44" font-family="'Noto Sans CJK JP'">同じ場合</text><text x="947.473" y="351.157" fill="#000" font-size="11" textLength="87.999" font-family="'Noto Sans CJK JP'">印が無い、または</text><text x="947.473" y="367.085" fill="#000" font-size="11" textLength="109.999" font-family="'Noto Sans CJK JP'">組にした印と違う場合</text><polygon points="262.351,400.108,603.349,400.108,615.349,412.108,603.349,424.108,262.351,424.108,250.351,412.108,262.351,400.108" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="262.351" y="416.904" fill="#000" font-size="11" textLength="340.998" font-family="'Noto Sans CJK JP'">署名がチャレンジと合い、署名カウンタが保存値より増えている場合</text><text x="206.352" y="408.94" fill="#000" font-size="11" textLength="44" font-family="'Noto Sans CJK JP'">合う場合</text><text x="615.349" y="393.012" fill="#000" font-size="11" textLength="219.998" font-family="'Noto Sans CJK JP'">署名が合わない、カウンタが増えていない、</text><text x="615.349" y="408.94" fill="#000" font-size="11" textLength="131.999" font-family="'Noto Sans CJK JP'">またはパスキーが無い場合</text><rect x="40" y="434.108" width="140.001" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="50" y="458.028" fill="#000" font-size="12" textLength="120.001" font-family="'Noto Sans CJK JP'">セッションを作る処理</text><text x="50" y="475.404" fill="#000" font-size="12" textLength="86.389" font-family="'Noto Sans CJK JP'">createSession()</text><path d="M224.001,521.825 L224.001,532.237 L204.001,536.237 L224.001,540.237 L224.001,550.649 A0,0 0 0 0 224.001,550.649 L661.002,550.649 A0,0 0 0 0 661.002,550.649 L661.002,531.825 L651.002,521.825 L224.001,521.825 A0,0 0 0 0 224.001,521.825" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M651.002,521.825 L651.002,531.825 L661.002,531.825 L651.002,521.825" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="230.001" y="541.905" fill="#000" font-size="13" textLength="416" font-family="'Noto Sans CJK JP'">パスワードのログインと同じ。送信に失敗してもログインは成功のまま</text><rect x="16" y="508.861" width="188.001" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="532.781" fill="#000" font-size="12" textLength="168.001" font-family="'Noto Sans CJK JP'">ログイン通知メールを送る処理</text><text x="26" y="550.157" fill="#000" font-size="12" textLength="71.857" font-family="'Noto Sans CJK JP'">notifyLogin()</text><path d="M214.731,587.889 L214.731,598.301 L194.731,602.301 L214.731,606.301 L214.731,616.713 A0,0 0 0 0 214.731,616.713 L472.5,616.713 A0,0 0 0 0 472.5,616.713 L472.5,597.889 L462.5,587.889 L214.731,587.889 A0,0 0 0 0 214.731,587.889" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M462.5,587.889 L462.5,597.889 L472.5,597.889 L462.5,587.889" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="220.731" y="607.969" fill="#000" font-size="13" textLength="236.769" font-family="'Noto Sans CJK JP'">以降のAPIは、この Cookie を付けて呼ぶ</text><rect x="25.27" y="583.613" width="169.461" height="37.376" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="35.27" y="607.533" fill="#000" font-size="12" textLength="149.461" font-family="'Noto Sans CJK JP'">Cookie でセッションを返す</text><path d="M850.399,447.072 L850.399,457.484 L830.399,461.484 L850.399,465.484 L850.399,475.896 A0,0 0 0 0 850.399,475.896 L1014.399,475.896 A0,0 0 0 0 1014.399,475.896 L1014.399,457.072 L1004.399,447.072 L850.399,447.072 A0,0 0 0 0 850.399,447.072" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1004.399,447.072 L1004.399,457.072 L1014.399,457.072 L1004.399,447.072" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="856.399" y="467.152" fill="#000" font-size="13" textLength="143" font-family="'Noto Sans CJK JP'">どこが違うかは返さない</text><rect x="681.002" y="434.108" width="149.397" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="691.002" y="458.028" fill="#000" font-size="12" textLength="60" font-family="'Noto Sans CJK JP'">失敗を返す</text><text x="691.002" y="475.404" fill="#000" font-size="12" textLength="129.397" font-family="'Noto Sans CJK JP'">INVALID_CREDENTIALS</text><polygon points="432.85,626.989,444.85,638.989,432.85,650.989,420.85,638.989,432.85,626.989" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="1044.399" y="392.253" width="149.397" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1054.399" y="416.173" fill="#000" font-size="12" textLength="60" font-family="'Noto Sans CJK JP'">失敗を返す</text><text x="1054.399" y="433.549" fill="#000" font-size="12" textLength="129.397" font-family="'Noto Sans CJK JP'">INVALID_CREDENTIALS</text><polygon points="775.974,656.989,787.974,668.989,775.974,680.989,763.974,668.989,775.974,656.989" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M853.974,705.265 L853.974,715.677 L833.974,719.677 L853.974,723.677 L853.974,734.089 A0,0 0 0 0 853.974,734.089 L1121.974,734.089 A0,0 0 0 0 1121.974,734.089 L1121.974,715.265 L1111.974,705.265 L853.974,705.265 A0,0 0 0 0 853.974,705.265" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1111.974,705.265 L1111.974,715.265 L1121.974,715.265 L1111.974,705.265" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="859.974" y="725.345" fill="#000" font-size="13" textLength="247" font-family="'Noto Sans CJK JP'">成功しても失敗しても、応答と一緒に消す</text><rect x="717.973" y="700.989" width="116.001" height="37.376" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="727.973" y="724.909" fill="#