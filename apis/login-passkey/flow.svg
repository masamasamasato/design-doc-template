<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1426px;height:763px;background:#FFFFFF;" width="1426px" height="763px" viewBox="0 0 1426 763" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="7"><text x="635.398" y="36.24" fill="#000" font-size="14" textLength="153.999" font-weight="700" font-family="'Noto Sans CJK JP'">パスキーでログインする</text></g><path d="M808.664,56.272 L808.664,66.684 L788.664,70.684 L808.664,74.684 L808.664,85.096 A0,0 0 0 0 808.664,85.096 L1284.664,85.096 A0,0 0 0 0 1284.664,85.096 L1284.664,66.272 L1274.664,56.272 L808.664,56.272 A0,0 0 0 0 808.664,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1274.664,56.272 L1274.664,66.272 L1284.664,66.272 L1274.664,56.272" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="814.664" y="76.352" fill="#000" font-size="13" textLength="455" font-family="'Noto Sans CJK JP'">メールは入れない。セッションを作る前に、署名と署名カウンタの確認が必要</text><ellipse cx="778.664" cy="70.684" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><path d="M916.665,118.06 L916.665,128.472 L896.665,132.472 L916.665,136.472 L916.665,146.884 A0,0 0 0 0 916.665,146.884 L1405.795,146.884 A0,0 0 0 0 1405.795,146.884 L1405.795,128.06 L1395.795,118.06 L916.665,118.06 A0,0 0 0 0 916.665,118.06" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1395.795,118.06 L1395.795,128.06 L1405.795,128.06 L1395.795,118.06" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="922.665" y="138.14" fill="#000" font-size="13" textLength="468.13" font-family="'Noto Sans CJK JP'">画面に返し、ブラウザに付ける一時的な印（5分の Cookie）と組にして保存する</text><rect x="660.663" y="105.096" width="236.002" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="670.663" y="129.016" fill="#000" font-size="12" textLength="216.002" font-family="'Noto Sans CJK JP'">ログイン用のチャレンジを発行する処理</text><text x="670.663" y="146.392" fill="#000" font-size="12" textLength="112.129" font-family="'Noto Sans CJK JP'">issueLoginOptions()</text><path d="M906.519,192.812 L906.519,203.224 L886.519,207.224 L906.519,211.224 L906.519,221.636 A0,0 0 0 0 906.519,221.636 L1227.78,221.636 A0,0 0 0 0 1227.78,221.636 L1227.78,202.812 L1217.78,192.812 L906.519,192.812 A0,0 0 0 0 906.519,192.812" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1217.78,192.812 L1217.78,202.812 L1227.78,202.812 L1217.78,192.812" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="912.519" y="212.892" fill="#000" font-size="13" textLength="300.261" font-family="'Noto Sans CJK JP'">端末で PIN か生体認証をする。ここはサーバーの外</text><rect x="670.809" y="179.848" width="215.709" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="680.809" y="203.768" fill="#000" font-size="12" textLength="180.001" font-family="'Noto Sans CJK JP'">画面がチャレンジを端末へ渡し、</text><text x="680.809" y="221.144" fill="#000" font-size="12" textLength="195.709" font-family="'Noto Sans CJK JP'">端末の署名（assertion）を受け取る</text><rect x="699.465" y="254.6" width="158.397" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="709.465" y="278.521" fill="#000" font-size="12" textLength="138.397" font-family="'Noto Sans CJK JP'">assertion を検証する処理</text><text x="709.465" y="295.897" fill="#000" font-size="12" textLength="91.369" font-family="'Noto Sans CJK JP'">verifyAssertion()</text><polygon points="649.558,329.353,907.77,329.353,919.77,341.353,907.77,353.353,649.558,353.353,637.558,341.353,649.558,329.353" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="649.558" y="346.149" fill="#000" font-size="11" textLength="258.212" font-family="'Noto Sans CJK JP'">一時的な印とチャレンジの組は、渡したときと同じ?</text><text x="615.558" y="338.185" fill="#000" font-size="11" textLength="22" font-family="'Noto Sans CJK JP'">はい</text><text x="919.77" y="338.185" fill="#000" font-size="11" textLength="33" font-family="'Noto Sans CJK JP'">いいえ</text><polygon points="294.538,363.353,574.75,363.353,586.75,375.353,574.75,387.353,294.538,387.353,282.538,375.353,294.538,363.353" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="294.538" y="380.149" fill="#000" font-size="11" textLength="280.212" font-family="'Noto Sans CJK JP'">署名がチャレンジと合い、カウンタが前より増えている?</text><text x="260.538" y="372.185" fill="#000" font-size="11" textLength="22" font-family="'Noto Sans CJK JP'">はい</text><text x="586.75" y="372.185" fill="#000" font-size="11" textLength="33" font-family="'Noto Sans CJK JP'">いいえ</text><rect x="40" y="397.353" width="140.001" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="50" y="421.273" fill="#000" font-size="12" textLength="120.001" font-family="'Noto Sans CJK JP'">セッションを作る処理</text><text x="50" y="438.649" fill="#000" font-size="12" textLength="86.389" font-family="'Noto Sans CJK JP'">createSession()</text><path d="M224.001,485.069 L224.001,495.481 L204.001,499.481 L224.001,503.481 L224.001,513.893 A0,0 0 0 0 224.001,513.893 L661.002,513.893 A0,0 0 0 0 661.002,513.893 L661.002,495.069 L651.002,485.069 L224.001,485.069 A0,0 0 0 0 224.001,485.069" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M651.002,485.069 L651.002,495.069 L661.002,495.069 L651.002,485.069" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="230.001" y="505.149" fill="#000" font-size="13" textLength="416" font-family="'Noto Sans CJK JP'">パスワードのログインと同じ。送信に失敗してもログインは成功のまま</text><rect x="16" y="472.105" width="188.001" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="496.025" fill="#000" font-size="12" textLength="168.001" font-family="'Noto Sans CJK JP'">ログイン通知メールを送る処理</text><text x="26" y="513.401" fill="#000" font-size="12" textLength="71.857" font-family="'Noto Sans CJK JP'">notifyLogin()</text><path d="M214.731,551.133 L214.731,561.545 L194.731,565.545 L214.731,569.545 L214.731,579.957 A0,0 0 0 0 214.731,579.957 L664.588,579.957 A0,0 0 0 0 664.588,579.957 L664.588,561.133 L654.588,551.133 L214.731,551.133 A0,0 0 0 0 214.731,551.133" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M654.588,551.133 L654.588,561.133 L664.588,561.133 L654.588,551.133" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="220.731" y="571.213" fill="#000" font-size="13" textLength="428.857" font-family="'Noto Sans CJK JP'">Cookie はブラウザが覚えるログインの印。以降のAPIはこれを付けて呼ぶ</text><rect x="25.27" y="546.857" width="169.461" height="37.376" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="35.27" y="570.777" fill="#000" font-size="12" textLength="149.461" font-family="'Noto Sans CJK JP'">Cookie でセッションを返す</text><path d="M853.985,410.317 L853.985,420.729 L833.985,424.729 L853.985,428.729 L853.985,439.141 A0,0 0 0 0 853.985,439.141 L1017.986,439.141 A0,0 0 0 0 1017.986,439.141 L1017.986,420.317 L1007.986,410.317 L853.985,410.317 A0,0 0 0 0 853.985,410.317" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1007.986,410.317 L1007.986,420.317 L1017.986,420.317 L1007.986,410.317" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="859.985" y="430.397" fill="#000" font-size="13" textLength="143" font-family="'Noto Sans CJK JP'">どこが違うかは返さない</text><rect x="684.588" y="397.353" width="149.397" height="54.752" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="694.588" y="421.273" fill="#000" font-size="12" textLength="60" font-family="'Noto Sans CJK JP'">失敗を返す</text><text x="694.588" y="438.649" fill="#000" font-size="12" textLength="129.397" font-family="'Noto Sans CJK JP'"